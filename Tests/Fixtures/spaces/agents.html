<!doctype html>
<!-- Template "My agents", for something (contract 1). Every coding agent on this Mac as a card: who waits for the
     person first, who works, and, for one this space may write to, its conversation opened in place to talk to it in
     full: "/" for its own commands as it lists them, its model and its mode for its next turn, its helpers, and a
     message sent now or after this turn. Rights: "state" over every agent, "send". It keeps no memory: what it shows
     is rebuilt from the state each time it opens. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My agents</title>
<script type="application/json" id="something">
{
  "contract": 1,
  "title": "My agents",
  "description": "Who works, who waits for you, and a word to each.",
  "agents": { "see": "all" },
  "rights": ["state", "send"]
}
</script>
<style>
  [hidden] { display: none !important; }
  /* A calm control room, deep green-black by day and by night alike, as a control room stays lit the same: amber for
     what waits, green for what works. --soft stays readable (4.5:1) on the cards; --edge only draws lines. */
  :root {
    color-scheme: dark;
    --room: #0e1411; --card: #141b17; --sunk: #19221d; --edge: #26312b; --ink: #e8efe9; --soft: #a3b0a7; --faint: #8b988f;
    --work: #7bd88f; --work-bg: #1d3a26; --wait: #f2c14e; --wait-bg: #3a2e12; --amber: #f2c14e; --amber-ink: #241a00;
    --fail: #ff7b72; --you: #1f2b25; --deep: #213a2b;
    font: 14px/1.45 -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--room); color: var(--ink); }
  /* The bottom keeps clear of something's assistant, which floats over the page's bottom-right corner. */
  main { max-width: 1100px; margin: 0 auto; padding: 26px 30px 72px; display: flex; flex-direction: column; gap: 16px; }
  button, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  header { display: flex; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
  .live { color: var(--work); font-size: 12.5px; }
  .live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor;
                  margin-right: 6px; vertical-align: 1px; }
  #read { margin-left: auto; color: var(--faint); font-size: 12.5px; }

  /* Four counts, waiting first: a numeral and what it counts, equal tiles on one row that wrap two by two. */
  .counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .count { background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 12px 16px 14px; }
  .count b { display: block; font-size: 34px; line-height: 1.1; font-weight: 500; font-variant-numeric: tabular-nums; }
  .count span { color: var(--soft); font-size: 12.5px; }
  .count.zero b { opacity: .4; }
  .count[data-count=waiting]:not(.zero) b { color: var(--amber); }
  #others { color: var(--faint); font-size: 12.5px; margin-top: -6px; }

  /* The cards: two by two; the open one takes a whole row. */
  #board { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-items: start; }
  .agent { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 14px 16px; min-width: 0;
           display: flex; flex-direction: column; gap: 10px; }
  .agent.st-waiting { border-color: var(--amber); box-shadow: inset 3px 0 0 var(--amber); }
  .agent.open { grid-column: 1 / -1; }
  .agent.fresh { animation: arrive 140ms ease-out; }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
  .head { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .tile { flex: none; display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 6px;
          background: var(--sunk); border: 1px solid var(--edge); font-size: 10.5px; font-weight: 600; color: var(--soft); }
  .name { font-weight: 600; font-size: 15px; white-space: nowrap; }
  .folder { color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pill { flex: none; margin-left: auto; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
          color: var(--soft); background: var(--sunk); }
  .st-working .pill { color: var(--work); background: var(--work-bg); }
  .st-waiting .pill { color: var(--wait); background: var(--wait-bg); }
  .st-error .pill { color: var(--fail); }
  .open .pill { margin-left: 4px; }
  .line { margin: 0; color: var(--soft); overflow-wrap: anywhere; }
  .fault { margin: 0; color: var(--fail); }
  .why { margin: 0; color: var(--faint); font-size: 12.5px; }
  .acts { display: flex; gap: 8px; }
  .btn { border: 1px solid var(--edge); background: var(--sunk); border-radius: 7px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--faint); }
  .btn.go { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 600; }
  .btn.next { background: var(--deep); border-color: var(--deep); font-weight: 600; }

  /* The open card's chips: its model and effort, its mode, each as the agent reported it, for its next turn. */
  .chips { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--edge); border-radius: 7px; background: var(--sunk);
          font-size: 12.5px; padding: 0 4px; height: 26px; }
  .chip select { appearance: none; border: 0; background: none; padding: 0 3px; cursor: pointer; font-size: 12.5px; field-sizing: content; }
  .chip select + select { color: var(--soft); }
  .chip::after { content: "⌄"; color: var(--faint); padding: 0 3px 4px 0; }
  .chip.fixed::after { content: none; }
  .chip.fixed { padding: 0 8px; color: var(--soft); }
  .close { border: 0; background: none; color: var(--faint); font-size: 16px; cursor: pointer; padding: 0 4px; }

  /* Its conversation, the latest lines: what you asked on the right, what it said with its tile, its steps quiet. */
  .thread { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .thread .you { align-self: flex-end; max-width: 72%; background: var(--you); border-radius: 9px; padding: 7px 11px; }
  .thread .it { display: flex; gap: 8px; align-items: baseline; }
  .thread .it .tile { height: 18px; min-width: 18px; font-size: 9px; }
  .thread .step { color: var(--faint); font-size: 12.5px; padding-left: 8px; }
  .thread .step::before { content: "○"; margin-right: 8px; }
  /* Its helpers: one line, a › to unfold each sub-agent and where it stands. */
  .helpers { border: 1px solid var(--edge); border-radius: 8px; font-size: 12.5px; color: var(--soft); }
  .helpers summary { display: flex; gap: 8px; align-items: center; padding: 8px 12px; cursor: pointer; list-style: none; }
  .helpers summary::-webkit-details-marker { display: none; }
  .helpers summary::before { content: "⌥"; color: var(--work); }
  .helpers summary::after { content: "›"; margin-left: auto; color: var(--faint); font-size: 15px; transition: transform 140ms ease-out; }
  .helpers[open] summary::after { transform: rotate(90deg); }
  .helpers b { color: var(--ink); font-weight: 600; }
  .helpers ul { list-style: none; margin: 0; padding: 0 12px 8px 30px; display: flex; flex-direction: column; gap: 3px; }
  .held { margin: 0; color: var(--soft); font-size: 12.5px; }

  /* The reply: "/" opens its commands, the field, then Send Now and After This Turn. */
  .reply { position: relative; display: flex; gap: 8px; align-items: center; border: 1px solid var(--edge); border-radius: 10px;
           padding: 6px 6px 6px 8px; background: var(--room); }
  .reply:focus-within { border-color: var(--faint); }
  .slash { flex: none; width: 30px; height: 28px; border-radius: 7px; border: 1px solid var(--edge); background: var(--sunk); color: var(--amber);
           cursor: pointer; font-weight: 600; }
  .reply textarea { flex: 1; min-height: 28px; resize: none; border: 0; background: none; outline: none; padding: 4px 2px; line-height: 20px; }
  .hint { margin: 0; display: flex; gap: 10px; align-items: baseline; background: var(--sunk); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; }
  .hint b { color: var(--amber); }
  .hint span { color: var(--faint); }
  .cmds { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 2; list-style: none; margin: 0; padding: 5px;
          background: var(--card); border: 1px solid var(--edge); border-radius: 10px; max-height: 240px; overflow: auto;
          box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
  .cmds li { display: flex; gap: 12px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .cmds li b { color: var(--amber); font-weight: 600; flex: none; min-width: 90px; }
  .cmds li span { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmds li[aria-selected=true] { background: var(--sunk); }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; color: var(--faint); font-size: 11.5px; }
  .keys kbd { font: inherit; border: 1px solid var(--edge); border-radius: 4px; padding: 0 5px; margin-right: 5px; }
  .keys .from { margin-left: auto; }
  .said { margin: 0; color: var(--work); font-size: 12.5px; min-height: 1em; }

  .empty { grid-column: 1 / -1; border: 1px dashed var(--edge); border-radius: 12px; padding: 28px; text-align: center; color: var(--soft); }
  #problem { border: 1px solid var(--fail); color: var(--fail); border-radius: 8px; padding: 8px 12px; margin: 0; }
  #notes { color: var(--faint); font-size: 12px; margin: 0; }
  @media (max-width: 700px) { main { padding: 18px 18px 72px; } .thread .you { max-width: 90%; } .keys .from { margin-left: 0; } }
  @media (prefers-reduced-motion: reduce) { .agent.fresh { animation: none; } }
</style>
</head>
<body>
<main>
  <header><h1>My agents</h1><span class="live">live</span><span id="read"></span></header>
  <section class="counts" aria-label="Counts">
    <div class="count" data-count="waiting"><b>–</b><span>waiting for you</span></div>
    <div class="count" data-count="working"><b>–</b><span>working</span></div>
    <div class="count" data-count="idle"><b>–</b><span>idle</span></div>
    <div class="count" data-count="unknown"><b>–</b><span>unknown</span></div>
  </section>
  <div id="others" hidden></div>
  <p id="problem" role="alert" hidden></p>
  <section id="board" aria-live="polite"></section>
  <p id="notes" hidden></p>
</main>
<script>
  // something.js is injected before this script: window.something is here. Every call returns a promise; a rejection
  // carries .code and .message, one sentence for the person. This page shows it in #problem and never swallows it.
  const $ = (id) => document.getElementById(id);
  const NAMES = { claude: "Claude Code", codex: "Codex", opencode: "OpenCode", pi: "pi", omp: "OMP", antigravity: "Antigravity", amp: "Amp" };
  const TILES = { claude: "CC", codex: "Cx", opencode: "OC", pi: "π", omp: "Om", antigravity: "Ag", amp: "A" };
  const label = (kind) => NAMES[kind] || "other agent";        // a kind this page does not know is "other agent"
  const WORDS = ["waiting", "working", "idle", "done", "error", "interrupted", "unknown"];
  const word = (state) => WORDS.includes(state) ? state : "unknown";
  // A right counts when granted plainly ("send") or for this kind ("send:claude"). Read granted, never the declaration.
  const has = (right, kind) => something.granted.rights.some((r) => r === right || r === right + ":" + kind);
  const make = (tag, className, text) => Object.assign(document.createElement(tag), { className, textContent: text ?? "" });
  // Folders are shown from the home folder; null stays unknown, never a guess.
  const tilde = (path) => path ? path.replace(/^\/Users\/[^/]+/, "~") : null;

  // Ages are measured on the state's own clock (its "at"), so they stay true whatever this Mac's clock says.
  let skew = 0, received = Date.now();
  const now = () => Date.now() + skew;
  function age(iso) {
    const s = Math.max(0, Math.round((now() - Date.parse(iso)) / 1000));
    return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min` : s < 86400 ? `${Math.floor(s / 3600)} h` : `${Math.floor(s / 86400)} d`;
  }
  function problem(error) {
    $("problem").hidden = !error;
    $("problem").textContent = error ? error.message : "";
  }

  // The latest items of an agent's thread, oldest first.
  function lines(state, agent, n) {
    const thread = state.threads.find((t) => t.id === agent.thread);
    return thread ? thread.turns.flatMap((t) => t.items).filter((i) => i.kind === "message" || i.kind === "tool").slice(-n) : [];
  }
  // What a closed card says under its name: the request it waits on, else its last line.
  function summary(state, agent) {
    const request = state.requests.find((r) => r.agent === agent.id);
    if (request) return (request.kind === "permission" ? `Asks to run ${request.tool ?? "a tool"}${request.about ? ": " + request.about : ""}.`
      : `Asks you a question${request.about ? ": " + request.about : ""}.`) + " Answer in something’s window.";
    const last = lines(state, agent, 1)[0], text = last ? last.text.split("\n")[0] : "";
    // Waiting on a permission where it runs: the step it stopped at is what it asks to run.
    if (word(agent.state) === "waiting") return (last && last.kind === "tool" && agent.waiting === "permission"
      ? `Asks to run ${last.tool ? last.tool.name + ": " : ""}${text}. ` : text ? text.replace(/[.?!]?$/, ". ") : "") + "It waits for you where it runs.";
    return text || (agent.kind === "other" ? "something sees only its process." : "Nothing said yet.");
  }
  const pill = (agent) => word(agent.state) === "waiting" && agent.updated ? `waits ${age(agent.updated)}` : word(agent.state);

  // One card per agent, made once and updated in place: a message being typed survives every change.
  const cards = new Map();
  let painted = false, open = null, menus = 0, state = null;
  function card(agent) {
    const node = make("article", "agent");
    node.dataset.id = agent.id;
    node.innerHTML = `<div class="head"><span class="tile"></span><span class="name"></span><span class="folder mono"></span>
        <span class="pill"></span><span class="chips" hidden></span></div>
      <p class="line"></p><p class="fault" hidden></p>
      <ol class="thread" hidden></ol><details class="helpers" hidden><summary></summary><ul></ul></details><p class="held" hidden></p>
      <div class="acts"><button type="button" class="btn write">Write to It</button></div>
      <div class="talk" hidden><p class="hint" hidden></p>
        <form class="reply"><ul class="cmds" role="listbox" hidden></ul>
          <button type="button" class="slash" aria-label="Its commands">/</button>
          <textarea rows="1" aria-label="Message" role="combobox" aria-autocomplete="list" aria-expanded="false"></textarea>
          <button type="submit" class="btn go" value="now">Send Now</button><button type="submit" class="btn next" value="next">After This Turn</button>
        </form>
        <div class="keys"><span class="now"><kbd>↩</kbd>now, it reads it at its next step</span><span class="after"><kbd>⌥↩</kbd>after this turn</span>
          <span class="own"></span><span class="from">through something · this page may write to your agents</span></div>
        <p class="said" aria-live="polite"></p></div>
      <p class="why" hidden></p>`;
    const form = node.querySelector("form"), box = form.querySelector("textarea");
    node.querySelector(".write").onclick = () => { open = agent.id; render(state); box.focus(); };
    commandMenu(node, box);
    const fit = () => { box.style.height = ""; box.style.height = box.value ? box.scrollHeight + "px" : ""; };
    box.addEventListener("input", () => { fit(); hint(node, box); });
    // ↩ sends now when the agent is at work and takes it, else for its next turn; ⌥↩ after this turn; ⇧↩ a new line.
    // The "/" menu's own ↩ comes first and is marked as used.
    box.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey || event.defaultPrevented) return;
      event.preventDefault();
      send(node, box, event.altKey || form.querySelector("[value=now]").hidden ? "next" : "now");
    });
    form.onsubmit = (event) => { event.preventDefault(); send(node, box, event.submitter && event.submitter.value === "now" ? "now" : "next"); };
    form.querySelector(".slash").onclick = () => { box.value = "/"; box.focus(); box.dispatchEvent(new Event("input")); };
    return node;
  }
  function send(node, box, when) {
    const text = box.value.trim(), agent = node.agent;
    if (!text) return;
    // "/name words", name one of the agent's own commands: sent as that command, the words its argument.
    const [, name, words] = text.match(/^\/(\S+)\s*([\s\S]*)$/) || [];
    const listed = name && (agent.commands || []).some((c) => c.value === name);
    something.send(agent.id, listed ? words : text, listed ? { when, command: name } : { when }).then(({ delivery }) => {
      box.value = ""; box.style.height = ""; hint(node, box);
      node.querySelector(".said").textContent = DELIVERY[delivery] || `Message ${delivery}.`;
      problem(null);
    }).catch(problem);
  }
  const DELIVERY = {
    started: "Sent. It opens a new turn.", steered: "Sent into the running turn.",
    queued: "Held. It goes in when this turn ends.", unconfirmed: "Sent into the running turn.",
  };
  // Over the field while its text starts with one of the agent's commands: what that command does.
  function hint(node, box) {
    const typed = box.value.match(/^\/(\S+)\s/), command = typed && (node.agent.commands || []).find((c) => c.value === typed[1]);
    const line = node.querySelector(".hint");
    line.hidden = !command;
    if (command) line.replaceChildren(make("b", "mono", "/" + command.value), make("span", "", command.label));
  }
  // The "/" menu: the commands the agent lists whose name starts with what follows "/", until a space; ↑↓ choose, ↩ or
  // a click puts "/name " in the box, Esc closes. Drawn from node.agent, the latest state's.
  function commandMenu(node, box) {
    const menu = node.querySelector(".cmds");
    let shown = [], at = 0;
    // VoiceOver follows the chosen row through the box: aria-activedescendant names it while the menu is open.
    menu.id = "cmds-" + ++menus;
    box.setAttribute("aria-controls", menu.id);
    const show = (on) => {
      menu.hidden = !on;
      box.setAttribute("aria-expanded", String(on));
      if (on) box.setAttribute("aria-activedescendant", `${menu.id}-${at}`); else box.removeAttribute("aria-activedescendant");
    };
    const draw = () => {
      const typed = box.value.match(/^\/(\S*)$/);
      shown = typed ? (node.agent.commands || []).filter((c) => c.value.startsWith(typed[1])) : [];
      at = Math.min(at, Math.max(0, shown.length - 1));
      menu.setAttribute("aria-label", `${label(node.agent.kind)}'s commands`);
      menu.replaceChildren(...shown.map((c, i) => {
        const row = make("li", "");
        Object.assign(row, { id: `${menu.id}-${i}`, onmousedown: (event) => { event.preventDefault(); at = i; pick(); } });
        row.setAttribute("role", "option");
        row.setAttribute("aria-selected", String(i === at));
        row.append(make("b", "mono", "/" + c.value), make("span", "", c.label));
        return row;
      }));
      show(shown.length > 0);
    };
    const pick = () => { box.value = "/" + shown[at].value + " "; show(false); shown = []; hint(node, box); };
    box.addEventListener("input", () => { at = 0; draw(); });
    box.addEventListener("blur", () => show(false));
    box.addEventListener("keydown", (event) => {
      if (menu.hidden || !shown.length) return;
      if (event.key === "ArrowDown" || event.key === "ArrowUp") at = (at + (event.key === "ArrowDown" ? 1 : shown.length - 1)) % shown.length;
      else if (event.key === "Enter" || event.key === "Tab") pick();
      else if (event.key === "Escape") show(false);
      else return;
      event.preventDefault();
      if (!menu.hidden) draw();
    });
  }

  // A chip that sets one of the agent's settings for its next turn, from the values it offers; its own word when it
  // offers none ("No modes"), and "Default model" while it has not said its model.
  function chooser(agent, key, fallback) {
    const options = (agent.options && agent.options[key]) || [], current = options.find((o) => o.value === agent[key]);
    if (!options.length || !agent.can[key]) return make("span", "", current ? current.label : agent[key] ?? fallback);
    const pick = make("select", "");
    pick.setAttribute("aria-label", { model: "Model", mode: "Mode", effort: "Effort" }[key]);
    if (!current) pick.append(Object.assign(make("option", "", agent[key] ?? fallback), { value: agent[key] ?? "" }));
    pick.append(...options.map((o) => Object.assign(make("option", "", o.label), { value: o.value })));
    pick.value = agent[key] ?? "";
    pick.onchange = () => something.set(agent.id, { [key]: pick.value }).then(() => problem(null), (error) => { problem(error); render(state); });
    return pick;
  }
  function chips(agent) {
    const model = make("span", "chip"), mode = make("span", "chip");
    model.append(chooser(agent, "model", "Default model"));
    if (agent.effort !== null || (agent.options && agent.options.effort)) model.append(chooser(agent, "effort", "Default effort"));
    mode.append(chooser(agent, "mode", "No modes"));
    [model, mode].forEach((c) => c.classList.toggle("fixed", !c.querySelector("select")));
    const close = Object.assign(make("button", "close", "×"), { type: "button", title: "Close", onclick: () => { open = null; render(state); } });
    close.setAttribute("aria-label", "Close its conversation");
    return [model, mode, close];
  }

  function update(node, agent) {
    node.agent = agent;
    const status = word(agent.state), q = (selector) => node.querySelector(selector);
    const shown = (selector, text) => { q(selector).hidden = !text; q(selector).textContent = text || ""; };
    // `can` says what a call would do now and `because` why not; the person's grant says whether this space may.
    const may = agent.can.send && has("send", agent.kind), opened = open === agent.id && may;
    node.className = `agent st-${status}${opened ? " open" : ""}${node.dataset.fresh ? " fresh" : ""}`;
    q(".tile").textContent = TILES[agent.kind] || "?";
    q(".name").textContent = label(agent.kind);
    q(".folder").textContent = tilde(agent.folder) ?? agent.name ?? "folder unknown";
    q(".pill").textContent = pill(agent);
    q(".chips").hidden = !opened;
    if (opened) q(".chips").replaceChildren(...chips(agent));
    shown(".line", opened ? "" : summary(state, agent));
    shown(".fault", agent.error ? agent.error.message : "");
    // Opened: its latest lines, its helpers as its stream marks them, and what waits for after this turn.
    q(".thread").hidden = !opened;
    if (opened) q(".thread").replaceChildren(...lines(state, agent, 6).map((i) => {
      const named = i.tool && i.text.toLowerCase().includes(i.tool.name.toLowerCase());   // "Started the workflow…" names its tool
      if (i.kind === "tool") return make("li", "step", (i.tool && !named ? i.tool.name + " " : "") + i.text.split("\n")[0]);
      if (i.author === "person") return make("li", "you", i.text);
      const said = make("li", "it");
      said.append(make("span", "tile", TILES[agent.kind] || "?"), make("span", "", i.text));
      return said;
    }));
    const helpers = agent.subagents || [], busy = helpers.filter((h) => h.status === "running"), ended = helpers.length - busy.length;
    q(".helpers").hidden = !opened || !helpers.length;
    if (opened && helpers.length) {
      q(".helpers summary").replaceChildren(make("b", "", "Its helpers"), [busy.length && `${busy.length} sub-agent${busy.length === 1 ? "" : "s"} at work`,
        ended && `${ended} finished`].filter(Boolean).join(" · "));
      q(".helpers ul").replaceChildren(...helpers.map((h) => make("li", "", `${h.name} · ${h.status === "running" ? "at work" : h.status}`)));
    }
    shown(".held", opened && agent.queue.length ? `${agent.queue.length} held for after this turn: “${agent.queue[0].text}”` : "");
    q(".acts").hidden = opened || !may;
    q(".talk").hidden = !opened;
    q(".slash").hidden = !(agent.commands && agent.commands.length);
    q(".own").replaceChildren(...(agent.commands && agent.commands.length ? [make("kbd", "", "/"), `${label(agent.kind)}’s own commands`] : []));
    // Send Now steers into a running turn; to an agent not at work there is one send, for its next turn.
    const steer = agent.can.steer && status === "working";
    q("[value=now]").hidden = !steer;
    q("[value=next]").textContent = steer ? "After This Turn" : "Send";
    q(".now").hidden = q(".after").hidden = !steer;
    q("textarea").placeholder = `Write to ${label(agent.kind)}…`;
    shown(".why", agent.can.send ? (may ? "" : `You did not allow this space to write to ${label(agent.kind)}. Change its sentence beside it (⌘I).`)
      : agent.because.send || "");
  }

  function render(next) {
    state = next;
    received = Date.now();
    if (state.at) skew = Date.parse(state.at) - Date.now();
    const counts = {};
    state.agents.forEach((a) => { const w = word(a.state); counts[w] = (counts[w] || 0) + 1; });
    document.querySelectorAll("[data-count]").forEach((node) => {
      const n = counts[node.dataset.count] || 0;
      node.querySelector("b").textContent = n;
      node.classList.toggle("zero", n === 0);
    });
    const others = ["error", "interrupted", "done"].filter((w) => counts[w]).map((w) => `${counts[w]} ${w}`);
    $("others").hidden = !others.length;
    $("others").textContent = "Also " + others.join(" · ");

    // The open card first, then waiting, then working, then the rest; newest activity first within each.
    if (!state.agents.some((a) => a.id === open)) open = null;
    const rank = (a) => (a.id === open ? -1 : ["waiting", "error", "working", "idle", "interrupted", "unknown", "done"].indexOf(word(a.state)));
    const order = state.agents.slice().sort((a, b) => rank(a) - rank(b) || (b.updated || "").localeCompare(a.updated || ""));
    for (const id of cards.keys()) if (!order.some((a) => a.id === id)) { cards.get(id).remove(); cards.delete(id); }
    const board = $("board");
    order.forEach((agent, index) => {
      if (!cards.has(agent.id)) {
        cards.set(agent.id, card(agent));
        if (painted) cards.get(agent.id).dataset.fresh = "1";
      }
      const node = cards.get(agent.id);
      update(node, agent);
      // Move a card only when its place changed: moving a node takes the focus away from its reply box.
      if (board.children[index] !== node) board.insertBefore(node, board.children[index] || null);
    });
    board.querySelectorAll(".empty").forEach((n) => n.remove());
    if (!order.length) {
      board.append(make("div", "empty", has("state", "")
        ? "This space sees no agent right now."
        : "This space may not see your agents. Change its sentence beside it (⌘I)."));
    }
    // A program whose files changed shape says so once, quietly under the cards, while one of its agents is here.
    const notes = Object.entries(state.kinds).filter(([kind, k]) => k.note && state.agents.some((a) => a.kind === kind)).map(([, k]) => k.note);
    $("notes").hidden = !notes.length;
    $("notes").textContent = notes.map((n) => "⚠ " + n).join("  ");
    painted = true;
    tick();
  }

  // "read 4 seconds ago" and the waiting ages tick each second, without redrawing the cards; not while hidden.
  function tick() {
    const s = Math.round((Date.now() - received) / 1000);
    $("read").textContent = `read ${s < 2 ? "just now" : s < 60 ? s + " seconds ago" : Math.floor(s / 60) + " min ago"}`;
    cards.forEach((node) => { if (node.agent) node.querySelector(".pill").textContent = pill(node.agent); });
  }
  let ticking = setInterval(tick, 1000);
  document.addEventListener("visibilitychange", () => {
    clearInterval(ticking);
    if (!document.hidden) { tick(); ticking = setInterval(tick, 1000); }
  });

  const load = () => something.state().then((next) => { render(next); problem(null); }, problem);
  something.on("change", render);
  something.on("granted", load);   // a right given or revoked while the space is open
  load();
</script>
</body>
</html>
