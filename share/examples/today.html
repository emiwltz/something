<!doctype html>
<!-- Example space: what the agents did today, read from their threads and turns. It only reads ("state", every
     agent). When nothing happened yet today, it shows the last day that had activity, and says which day it is. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today</title>
<script type="application/json" id="something">
{
  "contract": 1,
  "title": "Today",
  "description": "What your agents did today: what was asked, what they ran, where each one stands.",
  "agents": { "see": "all" },
  "rights": ["state"]
}
</script>
<style>
  [hidden] { display: none !important; }
  :root {
    color-scheme: light dark;
    --paper: #fbf8f2; --ink: #26231f; --soft: #7d766b; --rule: #e6dfd2; --accent: #9b3d23; --chip: #f0ebe1;
    font: 15px/1.55 ui-serif, "New York", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1b1a18; --ink: #ebe6dc; --soft: #a39b8e; --rule: #34312b; --accent: #e08a6a; --chip: #2a2824; }
  }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 36px 32px 48px; }
  .eyebrow { font: 600 11px/1 -apple-system, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 34px; font-weight: 600; margin: 8px 0 6px; letter-spacing: -.01em; }
  #summary { color: var(--soft); font-size: 17px; margin: 0 0 28px; }
  section { border-top: 1px solid var(--rule); padding: 18px 0 6px; }
  h2 { font-size: 20px; margin: 0; }
  .where { font: 12px ui-monospace, Menlo, monospace; color: var(--soft); margin: 2px 0 12px; overflow-wrap: anywhere; }
  .turn { display: grid; grid-template-columns: 64px 1fr; gap: 12px; margin: 0 0 14px; }
  .time { font: 13px -apple-system, system-ui, sans-serif; color: var(--soft); padding-top: 2px; font-variant-numeric: tabular-nums; }
  .asked { font-size: 16px; }
  .asked::before { content: "“"; } .asked::after { content: "”"; }
  .did { font: 13px -apple-system, system-ui, sans-serif; color: var(--soft); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { background: var(--chip); border-radius: 4px; padding: 1px 7px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink); }
  .answer { margin-top: 6px; color: var(--ink); opacity: .85; font-size: 14px; }
  .state { font-weight: 600; color: var(--accent); }
  footer { border-top: 1px solid var(--rule); margin-top: 20px; padding-top: 12px; color: var(--soft); font: 12px/1.5 -apple-system, system-ui, sans-serif; }
  #problem { font-family: -apple-system, system-ui, sans-serif; border-left: 3px solid var(--accent); padding: 8px 12px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow" id="eyebrow">Today</div>
  <h1 id="day"></h1>
  <p id="summary">Reading your agents…</p>
  <p id="problem" role="alert" hidden></p>
  <div id="agents"></div>
  <footer>For each agent, something keeps the last 10 turns of its current conversation, so older work and earlier
    conversations are not here. The times are this Mac's.</footer>
</main>
<script>
  const NAMES = { claude: "Claude Code", codex: "Codex", opencode: "OpenCode", pi: "pi", omp: "OMP" };
  const label = (kind) => NAMES[kind] || "Other agent";
  const $ = (id) => document.getElementById(id);
  const element = (tag, className, text) => Object.assign(document.createElement(tag), { className: className || "", textContent: text || "" });
  const dayOf = (time) => new Date(time).toDateString();
  const short = (folder) => folder === null ? "folder unknown" : folder.replace(/^\/Users\/[^/]+(?=\/|$)/, "~");
  const clip = (text, length) => text.length > length ? text.slice(0, length - 1) + "…" : text;
  const plural = (count, word) => `${count} ${word}${count === 1 ? "" : "s"}`;

  // Each turn with a known start, with its agent: a turn whose start is null cannot be placed on a day.
  function turns(state) {
    return state.threads.flatMap(function (thread) {
      const agent = state.agents.find((a) => a.id === thread.agent);
      return agent ? thread.turns.filter((t) => t.started !== null).map((turn) => ({ agent, thread, turn })) : [];
    });
  }

  function entry({ turn }) {
    const row = element("div", "turn");
    const time = new Date(turn.started).toLocaleTimeString(document.documentElement.lang, { hour: "2-digit", minute: "2-digit" });
    const body = element("div");
    const asked = turn.items.find((i) => i.kind === "message" && i.author === "person");
    body.append(asked ? element("div", "asked", clip(asked.text, 280)) : element("div", "asked", "A turn the agent started itself"));
    const tools = turn.items.filter((i) => i.kind === "tool");
    const did = element("div", "did");
    const names = [...new Set(tools.map((i) => i.tool ? i.tool.name : "tool"))];
    did.append(tools.length ? plural(tools.length, "tool call") + ":" : "No tool used.", ...names.map((n) => element("span", "chip", n)));
    const failed = tools.filter((i) => i.tool && i.tool.status === "failed").length;
    if (failed) did.append(`${failed} failed.`);
    did.append(element("span", "state", turn.state === "done" ? "" : turn.state));
    body.append(did);
    const answers = turn.items.filter((i) => i.kind === "message" && i.author === "agent");
    if (answers.length) body.append(element("div", "answer", clip(answers[answers.length - 1].text, 360)));
    row.append(element("div", "time", time), body);
    return row;
  }

  function render(state) {
    const all = turns(state);
    const today = new Date().toDateString();
    // The day to show: today, or the last day with a turn, said plainly so it is never taken for today.
    const latest = all.map((e) => e.turn.started).sort().pop();
    const shown = all.some((e) => dayOf(e.turn.started) === today) || !latest ? today : dayOf(latest);
    const date = new Date(shown === today ? Date.now() : latest);
    $("day").textContent = date.toLocaleDateString(document.documentElement.lang, { weekday: "long", day: "numeric", month: "long" });
    $("eyebrow").textContent = shown === today ? "Today" : "Nothing yet today · the last day with activity";
    const day = all.filter((e) => dayOf(e.turn.started) === shown).sort((a, b) => a.turn.started.localeCompare(b.turn.started));
    const agents = [...new Set(day.map((e) => e.agent))];
    const calls = day.reduce((sum, e) => sum + e.turn.items.filter((i) => i.kind === "tool").length, 0);
    $("summary").textContent = day.length
      ? `${plural(agents.length, "agent")}, ${plural(day.length, "turn")}, ${plural(calls, "tool call")}.`
      : "No agent has worked yet, as far as something can see.";
    $("agents").replaceChildren(...agents.map(function (agent) {
      const section = element("section");
      section.append(element("h2", "", `${agent.name === null ? "Unnamed" : agent.name} — ${label(agent.kind)}`),
        element("div", "where", `${short(agent.folder)} · now ${agent.state}`), ...day.filter((e) => e.agent === agent).map(entry));
      return section;
    }));
  }

  function problem(error) {
    $("problem").hidden = false;
    $("problem").textContent = error.message;
  }

  function start() {
    $("problem").hidden = true;
    if (!something.granted.rights.includes("state")) problem({ message: "This space may not read your agents. Allow it in its card, in Home." });
    something.state().then(render, problem);
  }
  something.on("change", render);
  something.on("granted", start);
  start();
</script>
</body>
</html>
