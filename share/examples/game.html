<!doctype html>
<!-- Example space: a small puzzle that needs no agent. Its one right is "store", the space's own memory, where it
     keeps the level reached and the best score of each level. Refused, the game still plays and says it forgets. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanterns</title>
<script type="application/json" id="something">
{
  "contract": 1,
  "title": "Lanterns",
  "description": "A small puzzle: light every lantern. It remembers your level and your best scores.",
  "rights": ["store"]
}
</script>
<style>
  [hidden] { display: none !important; }
  :root {
    color-scheme: dark;
    --night: #10162b; --deep: #0a0f1f; --ink: #f4ecd8; --soft: #9aa3c4; --lit: #ffcf5c; --glow: rgba(255, 190, 70, .55); --dark: #263055;
    font: 15px/1.5 ui-rounded, -apple-system, system-ui, sans-serif;
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--ink);
         background: radial-gradient(ellipse at 50% 0%, #1d2650 0%, var(--night) 55%, var(--deep) 100%); }
  main { text-align: center; padding: 16px; }
  h1 { font-size: 30px; margin: 0; letter-spacing: .02em; }
  .line { color: var(--soft); margin: 4px 0 14px; }
  #board { display: grid; grid-template-columns: repeat(5, 52px); gap: 10px; justify-content: center; margin: 0 auto 14px; }
  #board button { width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; background: var(--dark);
                  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25); transition: background .18s, box-shadow .18s, transform .08s; }
  #board button.lit { background: radial-gradient(circle at 50% 40%, #fff3c4 0%, var(--lit) 45%, #e89a2c 100%);
                      box-shadow: 0 0 22px var(--glow), inset 0 -4px 0 rgba(0, 0, 0, .15); }
  #board button:active { transform: scale(.94); }
  .score { display: flex; gap: 24px; justify-content: center; color: var(--soft); font-variant-numeric: tabular-nums; }
  .score b { color: var(--ink); font-size: 20px; display: block; }
  .actions { margin-top: 10px; display: flex; gap: 10px; justify-content: center; }
  .actions button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--dark); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
  #won { color: var(--lit); min-height: 1.5em; margin-top: 8px; }
  #memory { color: var(--soft); font-size: 12px; margin: 12px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Lanterns</h1>
  <p class="line">Light every lantern. A touch flips a lantern and its four neighbours.</p>
  <div id="board" role="grid" aria-label="Lanterns"></div>
  <div class="score">
    <div><b id="level">1</b>level</div>
    <div><b id="moves">0</b>moves</div>
    <div><b id="best">—</b>best here</div>
  </div>
  <div id="won" role="status"></div>
  <div class="actions">
    <button type="button" id="again">Start the level again</button>
    <button type="button" id="next" hidden>Next level</button>
  </div>
  <p id="memory"></p>
</main>
<script>
  const SIZE = 5;
  const $ = (id) => document.getElementById(id);
  // The memory the space keeps between openings: { level, best: { "<level>": moves } }. Without the "store" right
  // the game keeps it only while the window is open.
  let memory = { level: 1, best: {} };
  let lights = [], moves = 0;
  const remembers = () => something.granted.rights.includes("store");

  // The same level always gives the same board: a small seeded generator, pressed from a fully lit board, so every
  // board can be solved.
  function board(level) {
    let seed = level * 2654435761 % 4294967296;
    const random = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const cells = new Array(SIZE * SIZE).fill(true);
    for (let press = 0; press < 3 + level; press++) flip(cells, Math.floor(random() * cells.length));
    if (cells.every(Boolean)) flip(cells, 12);
    return cells;
  }

  function flip(cells, at) {
    const row = Math.floor(at / SIZE), column = at % SIZE;
    [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function ([dr, dc]) {
      const r = row + dr, c = column + dc;
      if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) cells[r * SIZE + c] = !cells[r * SIZE + c];
    });
  }

  function draw() {
    $("board").replaceChildren(...lights.map(function (lit, at) {
      const lantern = document.createElement("button");
      lantern.type = "button";
      lantern.className = lit ? "lit" : "";
      lantern.setAttribute("aria-label", lit ? "lit lantern" : "dark lantern");
      lantern.onclick = () => press(at);
      return lantern;
    }));
    $("level").textContent = memory.level;
    $("moves").textContent = moves;
    const best = memory.best[memory.level];
    $("best").textContent = best === undefined ? "—" : best;
  }

  function play(level) {
    memory.level = level;
    lights = board(level);
    moves = 0;
    $("won").textContent = "";
    $("next").hidden = true;
    draw();
    keep();
  }

  function press(at) {
    if (lights.every(Boolean)) return;
    flip(lights, at);
    moves += 1;
    if (lights.every(Boolean)) {
      const best = memory.best[memory.level];
      if (best === undefined || moves < best) memory.best[memory.level] = moves;
      $("won").textContent = best === undefined || moves < best ? `Every lantern lit, in ${moves} moves: your best here.` : `Every lantern lit, in ${moves} moves.`;
      $("next").hidden = false;
      keep();
    }
    draw();
  }

  // Writes are whole and atomic: the memory is written as one document each time.
  function keep() {
    if (!remembers()) return;
    something.store.set("", memory).catch(said);
  }

  function said(error) { $("memory").textContent = error.message; }

  function explain() {
    $("memory").textContent = remembers() ? "Your level and best scores are kept in this space's memory."
      : "This space may not keep a memory, so it forgets your level when the window closes. Allow it in its card, in Home.";
  }

  // The memory kept by an earlier opening, or null when there is none or it is not the shape this page writes.
  function recall() {
    return something.store.get("").then((kept) =>
      kept && typeof kept.level === "number" && kept.best && typeof kept.best === "object" ? kept : null);
  }

  function start() {
    explain();
    const read = remembers() ? recall() : Promise.resolve(null);
    read.then(function (kept) {
      if (kept) memory = kept;
      play(memory.level);
    }).catch(function (error) { said(error); play(memory.level); });
  }

  // A right switched in the card never wipes the board in play. When "store" arrives, the best scores kept earlier
  // join this game's, and the memory is written; when it goes, the sentence says the game now forgets.
  let remembered = remembers();
  function regranted() {
    explain();
    const arrived = remembers() && !remembered;
    remembered = remembers();
    if (!arrived) return;
    recall().then(function (kept) {
      if (kept) {
        for (const [level, best] of Object.entries(kept.best)) {
          if (!(memory.best[level] <= best)) memory.best[level] = best;
        }
      }
      draw();
      keep();
    }).catch(said);
  }

  $("again").onclick = () => play(memory.level);
  $("next").onclick = () => play(memory.level + 1);
  something.on("granted", regranted);
  start();
</script>
</body>
</html>
