<!doctype html>
<!-- Template "My agents", for something (contract 1). A control room: every coding agent on this Mac, who waits for
     the person first, who works, and a word to each one this space may write to. Rights: "state" over every agent,
     "send". It keeps no memory: what it shows is rebuilt from the state each time it opens. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My agents</title>
<script type="application/json" id="something">
{
  "contract": 1,
  "title": "My agents",
  "description": "Who works, who waits for you, and a word to each.",
  "agents": { "see": "all" },
  "rights": ["state", "send"]
}
</script>
<style>
  [hidden] { display: none !important; }
  /* Night shift (dark) is the room's natural light; day shift (light) keeps the same instruments on pale glass, under
     the room's dark header band. --faint is for text and stays readable (4.5:1); --dim only for dots, rules, DONE. */
  :root {
    color-scheme: light dark;
    --room: #e8ede9; --panel: #f6f9f6; --edge: #c9d3cc; --ink: #10261a; --soft: #4f5c54; --faint: #68746c; --dim: #8b978f;
    --work: #12873e; --wait: #b86b00; --fail: #c62828; --done: #6f7a73; --scan: rgba(16, 38, 26, .025);
    --band: #0b0d0c; --band-ink: #7cff9b; --band-soft: #8c9a92;
    --glow: 0;
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --room: #0b0d0c; --panel: #141816; --edge: #232b26; --ink: #d6ecdc; --soft: #a3b3a9; --faint: #8c9a92; --dim: #5d6661;
      --work: #7cff9b; --wait: #ffb547; --fail: #ff5c5c; --done: #5d6661; --scan: rgba(124, 255, 155, .025);
      --band: transparent; --band-ink: #7cff9b; --band-soft: #8c9a92;
      --glow: 1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--room); color: var(--ink);
    background-image: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px); /* faint scan lines */
  }
  main { min-height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 24px 28px 20px; }
  .label { text-transform: uppercase; letter-spacing: .12em; font-size: 10.5px; color: var(--faint); }

  /* The header band: dark in both lights, so the day shift still reads as the same room. */
  header { display: flex; align-items: baseline; gap: 18px; margin: -24px -28px 0; padding: 16px 28px 14px; background: var(--band);
           border-bottom: 1px solid var(--edge); }
  header .label { color: var(--band-soft); }
  h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .24em; color: var(--band-ink);
       text-shadow: 0 0 10px color-mix(in srgb, var(--band-ink) 45%, transparent); }
  header .clock { margin-left: auto; }
  .live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
                  background: var(--band-ink); margin-right: 7px; vertical-align: 1px; }

  /* Four counters: waiting first, because waiting is what needs the person. */
  /* Each counter is a numeral with its label on the same baseline: an instrument, not an empty box. */
  .counters { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .counter { flex: 1 1 0; min-width: 140px; max-width: 220px; display: flex; align-items: baseline; gap: 14px; background: var(--panel); border: 1px solid var(--edge);
             border-radius: 6px; padding: 10px 18px 12px; }
  .counter b { font-size: 56px; line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; }
  .counter.zero b { opacity: .35; }
  .counter:not(.zero) b { text-shadow: 0 0 calc(var(--glow) * 22px) color-mix(in srgb, currentColor 45%, transparent); }
  .t-waiting { color: var(--wait); } .t-working { color: var(--work); } .t-idle { color: var(--soft); }
  .t-done, .t-unknown, .t-interrupted { color: var(--done); } .t-error { color: var(--fail); }
  #others { flex: none; margin-left: 10px; }

  /* The deck takes the room's height: the log runs to the floor, the board fills from the top. */
  .deck { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: stretch; min-height: 0; }
  /* Tiles share each row (320 px at least, half the board at most); a waiting tile takes a row of its own. */
  .board { display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; align-items: stretch; }
  .board > * { flex: 1 1 320px; max-width: calc(50% - 6px); }
  .board > .waiting, .board > .empty { flex-basis: 100%; max-width: none; }
  .tile { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 12px 14px;
          display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  /* Only a tile that arrives after the first paint slides in: the first paint (the gallery's preview) is complete. */
  .tile.fresh { animation: arrive 120ms ease-out; }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
  .tile.unknown { border-style: dashed; }
  .tile.error { border-color: var(--fail); }
  /* A waiting tile spans the board and breathes amber until the person answers. The glow is drawn once, on a layer
     whose opacity alone moves: animating a shadow itself would paint it again at every frame. */
  .tile.waiting { position: relative; border-color: var(--wait);
                  box-shadow: 0 0 0 1px color-mix(in srgb, var(--wait) 8%, transparent), 0 0 calc(var(--glow) * 8px) color-mix(in srgb, var(--wait) 5%, transparent); }
  .tile.waiting::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
                         box-shadow: 0 0 0 1px color-mix(in srgb, var(--wait) 30%, transparent), 0 0 calc(var(--glow) * 26px) color-mix(in srgb, var(--wait) 16%, transparent);
                         animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0; } }
  .tile .top { display: flex; justify-content: space-between; gap: 10px; }
  .tile .body { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }   /* "why" sits at the tile's foot */
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 7px; vertical-align: 1px; }
  .working .dot { box-shadow: 0 0 calc(var(--glow) * 8px) currentColor; animation: pulse 1s ease-in-out infinite; } /* 1 Hz */
  @keyframes pulse { 50% { opacity: .25; } }
  .idle .dot, .unknown .dot { background: transparent; border: 1px solid currentColor; }
  .t-done .dot { background: var(--dim); }
  .name { font-size: 16px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .folder { color: var(--faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .last { color: var(--soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .last .age { color: var(--faint); }
  .ask { background: color-mix(in srgb, var(--wait) 12%, transparent); color: var(--wait); border-radius: 4px; padding: 7px 9px; }
  .fault { background: color-mix(in srgb, var(--fail) 12%, transparent); color: var(--fail); border-radius: 4px; padding: 7px 9px; }
  .held { color: var(--soft); font-size: 12px; }
  .why { color: var(--faint); font-size: 11.5px; border-top: 1px dashed var(--edge); padding-top: 6px; margin-top: auto; }
  .why::before { content: "WRITE · "; letter-spacing: .12em; }

  /* The reply box lives in its tile and is never redrawn: a change that arrives while the person types keeps the text. */
  .reply { display: flex; gap: 8px; align-items: stretch; margin-top: 4px; }
  .waiting .body:has(form:not([hidden])) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 1.1fr); gap: 6px 22px; }
  .waiting .reply { grid-column: 2; grid-row: 1 / span 5; margin: 0; flex-direction: column; }
  textarea { flex: 1; min-height: 34px; resize: none; font: inherit; color: var(--ink); background: transparent;
             border: 1px solid var(--edge); border-radius: 4px; padding: 7px 9px; }
  textarea:focus { outline: none; border-color: var(--work); }
  .buttons { display: flex; gap: 6px; justify-content: flex-end; }
  button { font: inherit; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
           background: transparent; border: 1px solid var(--edge); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--work); color: var(--work); }
  button.stop:hover { border-color: var(--fail); color: var(--fail); }
  .said { color: var(--work); font-size: 11.5px; min-height: 1em; }

  .empty { border: 1px dashed var(--edge); border-radius: 6px; padding: 28px; text-align: center; color: var(--soft); }
  #problem { border: 1px solid var(--fail); color: var(--fail); border-radius: 6px; padding: 8px 12px; margin: 0; }

  /* The signal log: the latest lines of every conversation, newest first, rebuilt from the threads. */
  .log { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 12px 14px; overflow: hidden; }
  .log ol { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .log li { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 2px 10px; font-size: 12px; }
  .log time { color: var(--faint); font-variant-numeric: tabular-nums; }
  .log .who { color: var(--soft); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; grid-column: 2; }
  .log .what { grid-column: 2; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .log li.ask .what { color: var(--wait); }
  .log li.quiet { display: block; color: var(--faint); }

  footer { margin-top: auto; border-top: 1px solid var(--edge); padding-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 26px; }
  footer .kind b { color: var(--soft); font-weight: 500; }
  footer .note { flex-basis: 100%; color: var(--wait); font-size: 11.5px; }

  @media (max-width: 1080px) { .deck { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 760px) {
    .counter b { font-size: 40px; }
    .board > * { max-width: none; }
    .deck { grid-template-columns: minmax(0, 1fr); }
    .waiting .body { display: flex; flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>MY AGENTS</h1>
    <span class="label live" id="link">LIVE</span>
    <span class="label clock" id="clock"></span>
  </header>
  <section class="counters" aria-label="Counts">
    <div class="counter" data-count="waiting"><b class="t-waiting">–</b><span class="label">Waiting</span></div>
    <div class="counter" data-count="working"><b class="t-working">–</b><span class="label">Working</span></div>
    <div class="counter" data-count="idle"><b class="t-idle">–</b><span class="label">Idle</span></div>
    <div class="counter" data-count="done"><b class="t-done">–</b><span class="label">Done</span></div>
    <div class="label" id="others" hidden></div>
  </section>
  <p id="problem" role="alert" hidden></p>
  <div class="deck">
    <section class="board" id="board" aria-live="polite"></section>
    <aside class="log"><span class="label">Signal log</span><ol id="log"></ol></aside>
  </div>
  <footer id="kinds"></footer>
</main>
<script>
  // something.js is injected before this script: window.something is here. Every call returns a promise; a rejection
  // carries .code and .message, one sentence for the person. This page shows it in #problem and never swallows it.
  const $ = (id) => document.getElementById(id);
  const NAMES = { claude: "Claude Code", codex: "Codex", opencode: "OpenCode", pi: "pi", omp: "OMP" };
  const label = (kind) => NAMES[kind] || "other agent";        // a kind this page does not know is "other agent"
  const WORDS = ["waiting", "working", "idle", "done", "error", "interrupted", "unknown"];
  const word = (state) => WORDS.includes(state) ? state : "unknown";
  // A right counts when granted plainly ("send") or for this kind ("send:claude"). Read granted, never the declaration.
  const has = (right, kind) => something.granted.rights.some((r) => r === right || r === right + ":" + kind);
  const make = (tag, className, text) => Object.assign(document.createElement(tag), { className, textContent: text ?? "" });
  // Folders are shown from the home folder; null stays "unknown", never a guess.
  const tilde = (path) => path ? path.replace(/^\/Users\/[^/]+/, "~") : "folder unknown";

  // Ages are measured on the state's own clock (its "at"), so they stay true whatever this Mac's clock says.
  let skew = 0;
  const now = () => Date.now() + skew;
  function age(iso) {
    if (!iso) return "";
    const s = Math.max(0, Math.round((now() - Date.parse(iso)) / 1000));
    return s < 60 ? `${s} s` : s < 3600 ? `${Math.floor(s / 60)} min` : s < 86400 ? `${Math.floor(s / 3600)} h` : `${Math.floor(s / 86400)} d`;
  }

  function problem(error) {
    $("problem").hidden = !error;
    $("problem").textContent = error ? error.message : "";
  }

  // What each agent did last, rebuilt from its thread: the newest item of its newest turn.
  function lastLine(state, agent) {
    const thread = state.threads.find((t) => t.id === agent.thread);
    const turn = thread && thread.turns[thread.turns.length - 1];
    const item = turn && turn.items[turn.items.length - 1];
    if (!item) return null;
    const text = item.text.split("\n")[0];
    const line = item.kind === "tool" ? `› ${item.tool ? item.tool.name + ": " : ""}${text}`
      : item.author === "person" ? `you: ${text}` : text;
    return { line, at: item.at };
  }

  // One tile per agent, made once and then updated in place (see .reply in the style).
  const tiles = new Map();
  let painted = false;                             // true once the first state was drawn
  function tile(agent) {
    const node = make("article", "tile");
    node.innerHTML = `<div class="top label"><span class="status"></span><span class="kind"></span></div>
      <div class="body"><div class="name"></div><div class="folder"></div><div class="last"></div>
      <div class="ask" hidden></div><div class="fault" hidden></div><div class="held" hidden></div>
      <form class="reply" hidden><textarea rows="1" aria-label="Message"></textarea>
        <div class="buttons"><button type="button" class="stop">Interrupt</button>
        <button type="submit" value="now">Steer now</button><button type="submit" value="next">Send</button></div>
        <div class="said" aria-live="polite"></div></form>
      <div class="why" hidden></div></div>`;
    const form = node.querySelector("form");
    form.onsubmit = (event) => {
      event.preventDefault();
      const text = form.querySelector("textarea").value.trim();
      if (!text) return;
      // "next" waits for the running turn to end (on a waiting agent: until the person answered in something's
      // window); "now" steers into the running turn. The button pressed says which.
      const when = event.submitter && event.submitter.value === "now" ? "now" : "next";
      something.send(agent.id, text, { when }).then(({ delivery }) => {
        form.querySelector("textarea").value = "";
        form.querySelector(".said").textContent = DELIVERY[delivery] || `Message ${delivery}.`;
        problem(null);
      }).catch(problem);
    };
    form.querySelector(".stop").onclick = () => something.interrupt(agent.id).then(({ interrupted }) => {
      form.querySelector(".said").textContent = interrupted ? "Interrupted. Its queue was emptied." : "No turn was running. Its queue was emptied.";
    }).catch(problem);
    return node;
  }
  const DELIVERY = {
    started: "Sent. It opens a new turn.", steered: "Sent into the running turn.",
    queued: "Held. It goes in when this turn ends.", unconfirmed: "Sent into the running turn.",
  };

  function update(node, agent, state) {
    const status = word(agent.state);
    node.className = "tile " + status + (node.dataset.fresh ? " fresh" : "");
    const q = (selector) => node.querySelector(selector);
    const show = (selector, text) => { q(selector).hidden = !text; q(selector).textContent = text || ""; };
    q(".status").className = "status t-" + status;
    q(".status").innerHTML = `<span class="dot"></span>`;
    q(".status").append(status + (agent.waiting === "permission" || agent.waiting === "answer" ? " · " + agent.waiting : ""));
    q(".kind").textContent = label(agent.kind) + (agent.origin === "elsewhere" ? " · elsewhere" : "");
    q(".name").textContent = agent.name ?? "unknown";
    q(".folder").textContent = tilde(agent.folder);
    const last = lastLine(state, agent);
    q(".last").textContent = last ? last.line + "  " : "";
    if (last) {
      const when = make("span", "age", age(last.at));
      when.dataset.at = last.at;                                 // the clock below keeps it current
      q(".last").append(when);
    }
    // A request is answered in a window of the Mac, never here: say what it asks and where to answer.
    const request = state.requests.find((r) => r.agent === agent.id);
    show(".ask", request ? (request.kind === "permission"
      ? `Asks to run ${request.tool ?? "a tool"}${request.about ? ": " + request.about : ""}. Answer in something's window.`
      : `Asks you a question${request.about ? ": " + request.about : ""}. Answer in something's window.`)
      : status === "waiting" ? "Waits for you. Answer where it runs." : "");
    show(".fault", agent.error ? agent.error.message : "");
    show(".held", agent.queue.length ? `${agent.queue.length} held for after this turn: “${agent.queue[0].text}”` : "");
    // `can` says what a call would do now and `because` why not; the person's grant says whether this space may.
    const may = has("send", agent.kind);
    const form = q("form");
    form.hidden = !(agent.can.send && may);
    q("textarea").placeholder = status === "waiting" ? "Message for after the answer…" : `A word to ${label(agent.kind)}…`;
    q("button[value=now]").hidden = !agent.can.steer || status === "idle";
    q(".stop").hidden = !agent.can.interrupt || !["working", "waiting"].includes(status);
    show(".why", !agent.can.send ? (agent.because.send || "This agent cannot take a message now.")
      : !may ? `You did not allow this space to write to ${label(agent.kind)}. Allow it in the space's Info.` : "");
  }

  function render(state) {
    if (state.at) skew = Date.parse(state.at) - Date.now();
    const counts = {};
    state.agents.forEach((a) => { const w = word(a.state); counts[w] = (counts[w] || 0) + 1; });
    document.querySelectorAll("[data-count]").forEach((node) => {
      const n = counts[node.dataset.count] || 0;
      node.querySelector("b").textContent = n;
      node.classList.toggle("zero", n === 0);
    });
    const others = ["error", "interrupted", "unknown"].filter((w) => counts[w]).map((w) => `${counts[w]} ${w}`);
    $("others").hidden = !others.length;
    $("others").textContent = "Also " + others.join(" · ");

    // Waiting first, then working, then the rest; newest activity first within each.
    const rank = (a) => ["waiting", "error", "working", "idle", "interrupted", "unknown", "done"].indexOf(word(a.state));
    const order = state.agents.slice().sort((a, b) => rank(a) - rank(b) || (b.updated || "").localeCompare(a.updated || ""));
    for (const id of tiles.keys()) if (!order.some((a) => a.id === id)) { tiles.get(id).remove(); tiles.delete(id); }
    const board = $("board");
    order.forEach((agent, index) => {
      if (!tiles.has(agent.id)) {
        tiles.set(agent.id, tile(agent));
        if (painted) tiles.get(agent.id).dataset.fresh = "1";
      }
      const node = tiles.get(agent.id);
      update(node, agent, state);
      // Move a tile only when its place changed: moving a node takes the focus away from its reply box.
      if (board.children[index] !== node) board.insertBefore(node, board.children[index] || null);
    });
    board.querySelectorAll(".empty").forEach((n) => n.remove());
    if (!order.length) {
      board.append(make("div", "empty", has("state", "")
        ? "No agent on this Mac right now. Start one in a terminal, and it appears here."
        : "This space may not see your agents. Allow “See your agents” in the space's Info."));
    }

    // The signal log: every item of every thread in scope, and the requests, newest first.
    const lines = [];
    state.threads.forEach((thread) => {
      const agent = state.agents.find((a) => a.id === thread.agent);
      const who = agent ? `${label(agent.kind)} · ${agent.name ?? "unknown"}` : thread.title ?? "unknown";
      thread.turns.forEach((turn) => turn.items.forEach((item) => lines.push({ at: item.at, who,
        what: (item.kind === "tool" ? "› " + (item.tool ? item.tool.name + " " : "") : item.author === "person" ? "you: " : "") + item.text.split("\n")[0] })));
    });
    state.requests.forEach((r) => {
      const agent = state.agents.find((a) => a.id === r.agent);
      lines.push({ at: r.at, ask: true, who: agent ? `${label(agent.kind)} · ${agent.name ?? "unknown"}` : "unknown",
        what: r.kind === "permission" ? `asks to run ${r.tool ?? "a tool"}${r.about ? ": " + r.about : ""}` : "asks you a question" });
    });
    lines.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
    $("log").replaceChildren(...lines.slice(0, 40).map((line) => {
      const item = make("li", line.ask ? "ask" : ""), what = make("span", "what", line.what);
      what.title = line.what;                                   // two lines at most on screen; the whole line on hover
      item.append(make("time", "", line.at ? clock(Date.parse(line.at), true) : "--:--"), make("span", "who", line.who), what);
      return item;
    }));
    if (!lines.length) $("log").append(make("li", "quiet", "Nothing said yet in the conversations this space sees."));

    painted = true;
    // Each program something knows: found or not, and its note when its files changed shape.
    $("kinds").replaceChildren(...Object.entries(state.kinds).map(([kind, k]) => {
      const node = make("span", "label kind", label(kind) + "  ");
      node.append(make("b", "", k.installed === null ? "unknown" : k.installed ? (k.reader === "changed" ? "⚠ found" : "found") : "not found"));
      return node;
    }), ...Object.values(state.kinds).filter((k) => k.note).map((k) => make("span", "note", "⚠ " + k.note)));
  }

  // "SAT 17 OCT · 09:00:04", or the time alone; in this Mac's time zone.
  const pad = (n) => String(n).padStart(2, "0");
  function clock(ms, timeOnly) {
    const d = new Date(ms), time = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    if (timeOnly) return time;
    return `${"SUN MON TUE WED THU FRI SAT".split(" ")[d.getDay()]} ${d.getDate()} ${"JAN FEB MAR APR MAY JUN JUL AUG SEP OCT NOV DEC".split(" ")[d.getMonth()]} · ${time}`;
  }

  // The clock and every age tick each second, without redrawing the tiles; not while the page is hidden.
  function tick() {
    $("clock").textContent = clock(now());
    document.querySelectorAll(".age[data-at]").forEach((n) => { if (n.dataset.at) n.textContent = age(n.dataset.at); });
  }
  let ticking = setInterval(tick, 1000);
  document.addEventListener("visibilitychange", () => {
    clearInterval(ticking);
    if (!document.hidden) { tick(); ticking = setInterval(tick, 1000); }
  });

  const load = () => something.state().then((state) => { render(state); tick(); problem(null); }, problem);
  something.on("change", render);
  something.on("granted", load);   // a right given or revoked while the space is open
  load();
</script>
</body>
</html>
