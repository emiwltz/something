<!doctype html>
<!-- Prompt Town, a space for something (contract 1). A village drawn like the old handheld RPGs. Each coding agent
     on this Mac is a villager: it lives in the house of its folder and walks to where its work is (the Forge for
     commands, the Library for reading, the Tower for the Web, the Pier to think, the tall grass with its sub-agents,
     the Square when it waits for the person, the Centre when it fails). Its sub-agents are the creatures following it.
     A finished answer is a letter: the flag of its mailbox goes up. The person walks up to them to read and talk, sets
     their model, mode and effort, calls new agents to any folder (a house is built for it), and finds a few secrets.
     Rights: "state" over every agent, "send", "launch", "store" (houses, letters read, badges, the creatures seen). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Town</title>
<script type="application/json" id="something">
{
  "contract": 1,
  "title": "Prompt Town",
  "description": "Your agents live in a village like an old handheld RPG: they walk to the Forge and the Library, and write you letters. Talk to them, call others over, build houses.",
  "agents": { "see": "all" },
  "rights": ["state", "send", "launch", "store"]
}
</script>
<style>
  [hidden] { display: none !important; }
  :root { --ink: #262a3a; --soft: #5d6684; --paper: #fbfaf4; --rim: #2c3452; --sky: #7fa8dc; --wait: #e2463c;
          font: 700 16px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b5a34; color: var(--ink); }
  #world { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  /* The secret four-green mode: four shades of green. */
  body.gb #world, body.gb #mini, body.gb #battleArt { filter: grayscale(1) sepia(1) hue-rotate(38deg) saturate(1.7) brightness(.9) contrast(1.15); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash .4s ease-out; }
  #flash.dark { background: #10131c; }
  @keyframes flash { from { opacity: .9; } }

  /* Everything that matters stays above the last 104 points, where something's assistant floats. */
  #stage { position: fixed; inset: 0 0 104px 0; pointer-events: none; }
  #stage > *, #bottom > *, .topright > * { pointer-events: auto; }

  /* The box of the old games: a dark rim, a pale inner line, paper inside. */
  .box { background: var(--paper); color: var(--ink); border: 4px solid var(--rim); border-radius: 10px;
         box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--sky), 0 5px 0 rgba(0, 0, 0, .28); }
  .hud { position: absolute; top: 14px; left: 14px; padding: 9px 16px 10px; display: flex; flex-direction: column; max-width: calc(100vw - 230px); }
  .hud b { letter-spacing: .14em; font-size: 14px; }
  #stats { font-size: 12.5px; font-weight: 600; color: var(--soft); }
  #stats .alert { color: var(--wait); font-weight: 700; }
  #stats .alert::before { content: "! "; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .topright { position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none !important; }
  .menu-btn, .mail-btn { padding: 8px 14px; font: inherit; font-size: 13px; letter-spacing: .12em; cursor: pointer; }
  .menu-btn small { font-size: 10.5px; font-weight: 600; color: var(--soft); letter-spacing: .02em; margin-left: 8px; }
  .menu-btn:hover { color: #3a5fb0; }
  .mail-btn { color: var(--wait); animation: wiggle 2.6s ease-in-out infinite; }
  @keyframes wiggle { 0%, 88%, 100% { transform: rotate(0); } 92% { transform: rotate(-5deg); } 96% { transform: rotate(5deg); } }
  .mini { padding: 6px; line-height: 0; cursor: pointer; }
  #mini { image-rendering: pixelated; border-radius: 3px; }

  /* The card of whoever is near: like the box of a creature in battle. */
  .card { position: absolute; top: 96px; left: 14px; width: 310px; padding: 10px 14px 11px; font-size: 13px; pointer-events: none !important; }
  .card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card .nm { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .lv { font-size: 12px; color: var(--soft); white-space: nowrap; }
  .card .kd { font-size: 11px; letter-spacing: .08em; color: var(--soft); display: flex; align-items: center; gap: 6px; }
  .card .kd i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .card .st { margin-top: 5px; font-size: 12.5px; }
  .card .ac { font-weight: 600; font-size: 12.5px; color: #3d4560; margin-top: 2px; overflow-wrap: anywhere; }
  .card .mt { font-weight: 600; font-size: 11px; color: var(--soft); margin-top: 6px; overflow-wrap: anywhere; }
  .card .go { font-size: 11px; color: #3a5fb0; margin-top: 6px; letter-spacing: .04em; }

  #toasts { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none !important; }
  .toast { padding: 6px 16px 7px; font-size: 13.5px; white-space: nowrap; animation: drop .25s ease-out; }
  .toast.wait { color: var(--wait); }
  .toast.badge { color: #7a4fc0; }
  @keyframes drop { from { transform: translateY(-12px); opacity: 0; } }
  .problem { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); margin: 0; padding: 9px 16px;
             color: var(--wait); width: max-content; max-width: min(680px, 90vw); font-size: 14px; }

  .battle { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); padding: 6px; line-height: 0; }
  #battleArt { width: 480px; height: 224px; max-width: calc(100vw - 60px); image-rendering: pixelated; border-radius: 4px; }
  .battle.hit #battleArt { animation: shake .3s steps(3); }
  @keyframes shake { 33% { transform: translateX(-4px); } 66% { transform: translateX(4px); } }

  #bottom { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 18px; }
  #bottom > * { width: min(880px, 100%); }
  #choiceRow { display: flex; justify-content: flex-end; }
  .choices { display: flex; flex-direction: column; min-width: 230px; max-height: min(50vh, 400px); overflow-y: auto; padding: 10px 18px 10px 12px; }
  .choices.start { position: fixed; top: 60px; right: 14px; }
  .choices button { font: inherit; color: inherit; background: none; border: 0; text-align: left; letter-spacing: .07em;
                    padding: 3px 6px 3px 24px; cursor: pointer; position: relative; flex: none; }
  .choices button.on::before, .panel.pick li.on::before { content: "▶"; position: absolute; left: 4px; top: 4px; font-size: 13px; }

  #talk { display: flex; flex-direction: column; }
  #tag { align-self: flex-start; margin-left: 18px; padding: 3px 12px 3px; font-size: 12.5px; letter-spacing: .1em; color: #fff;
         background: var(--rim); border-radius: 7px 7px 0 0; max-width: calc(100% - 36px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tag i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 8px; }
  .dialog { position: relative; min-height: 106px; padding: 16px 28px 18px; font-size: 17px; cursor: pointer; }
  #text { white-space: pre-wrap; overflow-wrap: anywhere; }
  #more { position: absolute; right: 18px; bottom: 9px; color: var(--wait); font-size: 13px; animation: nudge .6s ease-in-out infinite alternate; }
  @keyframes nudge { to { transform: translateY(3px); } }
  #form { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; cursor: default; }
  textarea { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: #fff; border: 2px solid #b7c4dc;
             border-radius: 6px; padding: 8px 10px; resize: none; }
  textarea:focus { outline: none; border-color: #3a5fb0; }
  #form .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #form .hint { flex: 1; font-size: 11.5px; font-weight: 600; color: var(--soft); }
  .key { font: inherit; font-size: 12.5px; letter-spacing: .1em; padding: 5px 12px; border: 2px solid var(--rim); border-radius: 6px;
         background: #fff; color: var(--ink); cursor: pointer; box-shadow: 0 2px 0 var(--rim); }
  .key:hover { background: #eef3fc; }
  .key.alt { border-color: #8a93ad; box-shadow: 0 2px 0 #8a93ad; }
  .key.on { background: #eaf0fb; outline: 2px solid #3a5fb0; outline-offset: 1px; }

  .panel { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); width: min(740px, calc(100vw - 36px));
           max-height: calc(100% - 90px); display: flex; flex-direction: column; padding: 14px 18px 12px; }
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .phead h2 { margin: 0; font-size: 14px; letter-spacing: .14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pmeta { font-size: 12px; font-weight: 600; color: var(--soft); margin: -4px 0 8px; }
  .panel ol { list-style: none; margin: 0; padding: 0 4px 0 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .panel li { position: relative; padding: 5px 8px 6px 26px; border-radius: 6px; flex: none; }
  .panel li::after { content: ""; display: block; clear: both; }
  .panel.pick li { cursor: pointer; }
  .panel.pick li.on { background: #eaf0fb; }
  .panel li.quiet { color: var(--soft); font-weight: 600; font-size: 14px; }
  .panel li.sep { margin-top: 6px; padding-left: 10px; border-top: 1px dashed #c9d2e4; border-radius: 0; }
  .panel li.sep .who { color: #3a5fb0; }
  .panel li.locked { opacity: .5; }
  .panel .who { font-size: 11.5px; letter-spacing: .08em; color: var(--soft); display: flex; gap: 8px; }
  .panel .who time { margin-left: auto; font-weight: 600; letter-spacing: 0; white-space: nowrap; }
  .panel .who .new { color: var(--wait); }
  .panel .what { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .panel .g { display: inline-block; width: 14px; text-align: center; }
  .panel .ico { float: left; width: 36px; height: 30px; margin: 1px 10px 0 -4px; image-rendering: pixelated; object-fit: contain; }
  .pbody { overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 600; font-size: 14.5px; line-height: 1.6; padding: 2px 6px 6px 2px; }
  .panel.letter .pbody { background: repeating-linear-gradient(transparent 0 22px, #e1e7f3 22px 23px); line-height: 23px; padding: 0 8px; }
  .pfoot { margin-top: 8px; font-size: 11.5px; font-weight: 600; color: var(--soft); }
  .pacts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }

  .hint-bar { text-align: center; font-size: 12px; font-weight: 600; color: #fff; letter-spacing: .03em; pointer-events: none !important;
              text-shadow: 0 1px 0 rgba(0, 0, 0, .7), 0 0 8px rgba(0, 0, 0, .5); }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
</style>
</head>
<body>
<canvas id="world" aria-label="Your agents' village"></canvas>
<div id="flash"></div>
<div id="stage">
  <div class="box hud"><b>PROMPT TOWN</b><span id="stats">…</span></div>
  <div class="topright">
    <button class="box menu-btn" id="menuBtn" type="button" tabindex="-1">MENU<small>Esc</small></button>
    <button class="box mail-btn" id="mailBtn" type="button" tabindex="-1" hidden></button>
    <div class="box mini" title="The map: click to go there"><canvas id="mini"></canvas></div>
  </div>
  <div class="box card" id="card" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <p class="box problem" id="problem" role="alert" hidden></p>
  <div class="box battle" id="battle" hidden><canvas id="battleArt" width="240" height="112"></canvas></div>
  <section class="box panel" id="panel" hidden>
    <div class="phead"><h2 id="ptitle"></h2><button class="key alt" id="pclose" type="button" tabindex="-1">CLOSE</button></div>
    <div class="pmeta" id="pmeta"></div>
    <ol id="plist"></ol>
    <div class="pbody" id="pbody"></div>
    <div class="pfoot" id="pfoot"></div>
    <div class="pacts" id="pacts"></div>
  </section>
  <div id="bottom">
    <div id="choiceRow"><div class="box choices" id="choices" hidden></div></div>
    <div id="talk" hidden>
      <div id="tag"></div>
      <div class="box dialog" id="dialog">
        <div id="text" aria-live="polite"></div><span id="more" hidden>▼</span>
        <div id="form" hidden>
          <textarea id="input" rows="2" aria-label="Your message"></textarea>
          <div class="row"><span class="hint">⏎ send · ⇧⏎ new line · Esc cancel</span><span id="btns"></span></div>
        </div>
      </div>
    </div>
    <div class="hint-bar" id="hint">Arrow keys or WASD: walk · Shift: run · Space: talk · click: go there · Esc: menu</div>
  </div>
</div>
<script>
"use strict";
// something.js is injected before this script. Every call returns a promise; a rejection carries .code and .message,
// one sentence for the person: the village says it in a dialog box, never swallows it.
const S = window.something;
const $ = (id) => document.getElementById(id);
const make = (tag, className, text) => Object.assign(document.createElement(tag), { className: className || "", textContent: text ?? "" });

/* ---------- Words ---------- */

const NAMES = { claude: "Claude Code", codex: "Codex", opencode: "OpenCode", pi: "pi", omp: "OMP" };
const label = (kind) => NAMES[kind] || "Other agent";            // a kind this page does not know is "other agent"
const KIND_COLOR = { claude: "#d97757", codex: "#66779c", opencode: "#2f8f83", pi: "#8a5cd0", omp: "#c9a227" };
const kindColor = (kind) => KIND_COLOR[kind] || "#8d8d96";
const WORDS = ["waiting", "working", "idle", "done", "error", "interrupted", "unknown"];
const word = (s) => WORDS.includes(s) ? s : "unknown";
const SAYS = { waiting: "waiting for you", working: "working", idle: "free", done: "finished", error: "in error", interrupted: "interrupted", unknown: "unknown state" };
const MARK = { waiting: ["!", "#e2463c"], working: ["…", "#2f9a52"], idle: ["•", "#5d6684"], done: ["z", "#5070c8"],
               error: ["✗", "#e2463c"], interrupted: ["~", "#8a8a96"], unknown: ["?", "#8a8a96"] };
// A right counts when granted plainly ("send") or for this kind ("send:claude"). Read granted, never the declaration.
const has = (right, kind) => !!S && S.granted.rights.some((r) => r === right || (kind && r === right + ":" + kind));
const mayAny = (right) => !!S && S.granted.rights.some((r) => r === right || r.startsWith(right + ":"));
const tilde = (path) => path ? path.replace(/^\/Users\/[^/]+/, "~") : "unknown folder";
const base = (path) => path ? path.replace(/\/+$/, "").split("/").pop() || path : null;
// One line of at most n characters, counted as a person sees them.
function line(text, n = 150) {
  const chars = Array.from((text || "").replace(/\s+/g, " ").trim());
  return chars.length > n ? chars.slice(0, n - 1).join("") + "…" : chars.join("");
}
function hash(text) { let h = 2166136261; for (const ch of String(text)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function noise(x, y, k = 0) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(k, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
const pad = (n) => String(n).padStart(2, "0");
const hhmm = (iso) => { if (!iso) return "--:--"; const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const dayOf = (iso) => { if (!iso) return "at an unknown date"; const d = new Date(iso); return d.toDateString() === new Date().toDateString() ? `today at ${hhmm(iso)}` : `on ${d.getDate()}/${d.getMonth() + 1} at ${hhmm(iso)}`; };
function ago(iso) {
  if (!iso) return "unknown";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)} min ago` : s < 86400 ? `${Math.floor(s / 3600)} h ago` : `${Math.floor(s / 86400)} d ago`;
}
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const anyOf = (list) => list[Math.floor(Math.random() * list.length)];
const canvasOf = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });

/* ---------- The village: 44 × 30 tiles of 16 pixels ---------- */

const T = 16, W = 44, H = 30;
const GRASS = 0, TALL = 1, PATH = 2, WATER = 3, TREE = 4, FLOWER = 5, WALL = 6, SIGN = 7, PAVE = 8, PIER = 9, PROP = 10;
const ground = new Uint8Array(W * H);
const tileAt = (x, y) => x < 0 || y < 0 || x >= W || y >= H ? TREE : ground[y * W + x];
const lay = (x, y, w, h, t) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) ground[j * W + i] = t; };
const tk = (x, y) => x + "," + y;
lay(0, 0, W, 1, TREE); lay(0, H - 1, W, 1, TREE); lay(0, 0, 1, H, TREE); lay(W - 1, 0, 1, H, TREE);
lay(21, 1, 2, H - 2, PATH); lay(1, 13, W - 2, 2, PATH);                       // the two avenues
lay(2, 6, 19, 1, PATH); lay(23, 7, 19, 1, PATH); lay(2, 20, 19, 1, PATH); lay(23, 20, 8, 1, PATH);
lay(31, 16, 9, 9, PAVE);                                                       // the Square
lay(2, 22, 8, 6, WATER); lay(6, 22, 1, 3, PIER);                               // the pond and its pier
lay(12, 22, 8, 6, TALL);                                                       // the tall grass
lay(20, 12, 4, 4, PATH);                                                       // a small plaza where the avenues cross

// Buildings that never move; each is where some kind of work happens.
const BUILDINGS = [
  { id: "library", x: 24, y: 2, w: 6, h: 4, name: "LIBRARY", place: "library",
    style: { roof: "#3f7f8c", roofDark: "#2c5f6a", roofLight: "#78b6c2", wall: "#e9e2d0", wallLine: "#d8cfb8", wallShade: "#c9bea2",
             windows: [7, 75], door: { x: 34, w: 28, kind: "double" }, plate: 64, pillars: [26, 66] } },
  { id: "forge", x: 31, y: 2, w: 5, h: 4, name: "FORGE", place: "forge",
    style: { roof: "#5a5a66", roofDark: "#40404a", roofLight: "#8a8a98", wall: "#b86a4a", wallLine: "#a25a3e", wallShade: "#8e4c33",
             windows: [56], door: { x: 33, w: 14, kind: "forge" }, plate: 40, chimney: 62 } },
  { id: "lab", x: 3, y: 16, w: 6, h: 4, name: "LAB", place: "lab",
    style: { roof: "#6a7fa8", roofDark: "#4f6188", roofLight: "#9fb2d8", wall: "#f4f4f0", wallLine: "#e2e2dc", wallShade: "#d0d0c8",
             windows: [7, 56, 74], door: { x: 35, w: 10, kind: "glass" }, plate: 40 } },
  { id: "centre", x: 25, y: 16, w: 5, h: 4, name: "CENTRE", place: "centre",
    style: { roof: "#e65a52", roofDark: "#b8403a", roofLight: "#f58a80", wall: "#f6f6f2", wallLine: "#e8e8e2", wallShade: "#dcdcd4",
             stripe: "#e05050", windows: [8, 56], door: { x: 32, w: 16, kind: "glass", h: 23 }, plate: 44 } },
  { id: "tower", x: 38, y: 1, w: 3, h: 5, name: "WAVES", place: "tower", tower: true },
];
BUILDINGS.forEach((b) => lay(b.x, b.y, b.w, b.h, WALL));
lay(26, 6, 2, 1, PATH); lay(33, 6, 1, 1, PATH); lay(39, 6, 1, 1, PATH);
// Eight plots: a folder an agent works in gets one, and a house is built on it.
const ROOFS = [["#d8574f", "#a83c37", "#ef8a7e"], ["#4f7fd0", "#355ea3", "#86aaf0"], ["#4fa25e", "#367a43", "#84cc8c"], ["#9a62c8", "#74449c", "#c49ae8"],
               ["#e0a030", "#b07a1c", "#f4c870"], ["#3fa6a0", "#2b7a76", "#7cd0ca"], ["#d8608c", "#a8426a", "#f098b8"], ["#7a6a5a", "#5a4c40", "#a8988a"]];
const PLOTS = [[3, 2], [9, 2], [15, 2], [3, 8], [9, 8], [15, 8], [25, 9], [31, 9]].map(([x, y], i) => ({ i, x, y, w: 4, h: 3,
  front: [x + 1, y + 3], sign: [x - 1, y + 2], spots: [[x, y + 3, "down"], [x + 2, y + 3, "down"], [x + 3, y + 3, "down"]], folder: null, build: 0,
  style: { roof: ROOFS[i][0], roofDark: ROOFS[i][1], roofLight: ROOFS[i][2], wall: "#f1e4c4", wallLine: "#e2d2ae", wallShade: "#d2bf94",
           windows: [38], door: { x: 19, w: 10, kind: "wood" }, roofH: 22, chimney: 46, box: true } }));
PLOTS.forEach((p) => { lay(p.x, p.y, 4, 3, WALL); lay(p.x + 1, p.y + 3, 1, p.y === 8 ? 2 : 1, PATH); lay(p.sign[0], p.sign[1], 1, 1, SIGN); });
// Things you can bump into and look at.
const PROPS = new Map();
function prop(type, x, y, w = 1, h = 1, extra = {}) {
  const p = { type, x, y, w, h, ...extra };
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) { ground[j * W + i] = PROP; PROPS.set(tk(i, j), p); }
  return p;
}
prop("fountain", 34, 19, 3, 3);
prop("board", 35, 17); prop("anvil", 36, 5); prop("bench", 32, 24); prop("bench", 38, 24); prop("bench", 14, 16);
prop("tent", 24, 22, 2, 2, { color: "#e08a3c", dark: "#a85e20" }); prop("tent", 28, 22, 2, 2, { color: "#3fb0b8", dark: "#2a7c82" });
const FIRE = prop("fire", 27, 24);
const CANDY = prop("candy", 42, 10);
const SIGNS = new Map([
  [tk(23, 12), ["PROMPT TOWN", "The village where your agents live, work and write to you."]],
  [tk(23, 1), ["↑ TO THE CLOUD", "Road under construction since 2006."]],
  [tk(23, 28), ["ROUTE 404", "Path not found. Please come back later."]],
  [tk(11, 21), ["TALL GRASS", "The companions romp here. Watch out for wild bugs!"]],
  [tk(7, 21), ["THOUGHT PIER", "Agents come here to think. They say you can fish here."]],
  [tk(32, 15), ["REQUEST SQUARE", "Those waiting for you line up around the fountain."]],

async function talkAgent(id) {
  let a = agentById(id);

  const sp = speakerOf(a), pages = story(a);
  for (const page of pages.slice(0, -1)) await say(sp, page);
  if (choicesFor(a).length === 1) return say(sp, pages[pages.length - 1]);
  await say(sp, pages[pages.length - 1], true);
  for (;;) {
    const pick = await choose(choicesFor(a));
    if (!pick) return;
    a = agentById(id);
    if (!a) return say(SYSTEM, "This agent is no longer in the village.");
    if (pick === "talk") return message(a, sp);
    if (pick === "stop") return interrupt(a, sp);
    if (pick === "resume") return resume(a, sp);

        foot: thread && !thread.complete ? "Only its last 10 turns are kept." : "" });

      rows: a.queue.map((q) => ({ who: "YOU", at: q.at, what: q.text })), foot: "They leave at the end of its turn. INTERRUPT clears them all." });

}

function resolveFolder(text, root) {
  let t = text.trim().replace(/\/+$/, "");
  if (!t) return null;
  const home = (root || "").match(/^\/Users\/[^/]+/);
  if (t.startsWith("~")) { if (!home) return null; t = home[0] + t.slice(1); }
  else if (!t.startsWith("/")) { if (!root) return null; t = root.replace(/\/+$/, "") + "/" + t; }
  const parts = [];
  for (const s of t.split("/")) { if (!s || s === ".") continue; if (s === "..") parts.pop(); else parts.push(s); }
  return "/" + parts.join("/");

}
function tag(text, sx, sy, color) {
  ctx.font = "700 12px ui-monospace, Menlo, monospace"; ctx.textBaseline = "middle"; ctx.textAlign = "start";
  const w = ctx.measureText(text).width + (color ? 22 : 12), x = Math.round(sx - w / 2), y = Math.round(sy - 19);
  ctx.fillStyle = "rgba(30, 34, 52, .9)"; ctx.beginPath(); ctx.roundRect(x, y, w, 19, 5); ctx.fill();
  if (color) { ctx.fillStyle = color; ctx.fillRect(x + 7, y + 6, 7, 7); }

}
function plate(text, wx, wy, size, color, stroke, room) {
  ctx.font = `700 ${size}px ui-monospace, Menlo, monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let t = text;
  while (t.length > 1 && ctx.measureText(t).width > room) t = t.slice(0, -2) + "…";
  if (stroke) { ctx.lineWidth = Math.max(2, size / 4); ctx.lineJoin = "round"; ctx.strokeStyle = stroke; ctx.strokeText(t, wx, wy); }
  ctx.fillStyle = color; ctx.fillText(t, wx, wy);

}
function iconOf(e) {
  if (e.type !== "agent") return e.type === "creature" && e.status === "failed" ? BUBBLE.error : null;
  if (e.word === "working") return e.move || e.path.length ? ["…", "#2f9a52"] : WORK_ICON[e.place] || ["…", "#2f9a52"];
  if ((e.word === "idle" || e.word === "done") && unread(letterOf(agentById(e.id)))) return ["letter", "#e2463c"];
  return BUBBLE[e.word] || null;
}
function draw(ts) {
  if (!cw) return;
  const cam = camera(), k = scale * dpr, light = daylight();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  ctx.setTransform(k, 0, 0, k, -cam.x * k, -cam.y * k);
  const vx = cam.x - T, vy = cam.y - T, vw = cw / scale + 2 * T, vh = ch / scale + 2 * T;
  ctx.fillStyle = forest; ctx.fillRect(Math.floor(vx / T) * T, Math.floor(vy / T) * T, vw + T, vh + T);
  drawGround(ts, light);
  const all = [...agentsE.values(), ...FIXED, ...creaturesE.values(), cat, player].sort((a, b) => a.py - b.py || (a === player ? 1 : -1));
  all.forEach((e) => e.type === "creature" ? drawCreature(e, ts) : e.type === "cat" ? drawCat(ts) : drawPerson(e, ts));

  const tower = BUILDINGS[4];
  if (Math.floor(ts / 700) % 2 || busyPlaces.has("tower")) rect(ctx, tower.x * T + 23, tower.y * T - 10, 2, 2, "#ff4040");
  if (busyPlaces.has("tower")) { ctx.strokeStyle = "rgba(160, 120, 255, .7)"; ctx.lineWidth = 1; const r = (ts / 30) % 18; ctx.beginPath(); ctx.arc(tower.x * T + 24, tower.y * T - 9, r, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  const dots = 1 + Math.floor(ts / 350) % 3;
  for (const e of [...agentsE.values(), ...creaturesE.values()]) {
    if (e.leaving) continue;
    const b = iconOf(e);
    if (!b) continue;
    const float = b[0] === "!" || b[0] === "letter" ? Math.abs(Math.sin(ts / 220)) * 2 : b[0] === "z" ? Math.sin(ts / 600) * 1.5 : 0;
    const top = e.type === "creature" ? e.py - 8 : e.py - 17 - (e.lift || 0);
    ctx.drawImage(bubbleSprite(b, dots), snap(e.px + 3), snap(top - float));
  }
  // Words at the screen's own resolution: names on the roofs, plates, who is near, what was just said.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sx = (wx) => (wx - cam.x) * scale, sy = (wy) => (wy - cam.y) * scale;
  PLOTS.forEach((p) => {
    if (p.folder && (!p.build || ts - p.build > BUILD_MS)) plate(base(p.folder), sx(p.x * T + 32), sy(p.y * T + 13.5), 6.5 * scale, "#ffffff", "#2a2a38", 58 * scale);
    else if (!p.folder) plate("TO BUILD", sx(p.x * T + 32), sy(p.y * T + 26), 5 * scale, "#fff3d6", "#6a4224", 56 * scale);
  });
  BUILDINGS.forEach((b) => {
    if (b.tower) plate(b.name, sx(b.x * T + 24), sy(b.y * T + 53), 4.5 * scale, "#ffffff", null, 38 * scale);
    else plate(b.name, sx(b.x * T + b.w * 8), sy(b.y * T + 13), (b.name.length > 8 ? 5.5 : 7) * scale, b.id === "centre" ? "#e0504a" : "#2a2a38", null, (b.style.plate - 2) * scale);
  });
  for (const e of [...agentsE.values(), ...FIXED, ...creaturesE.values(), cat]) {
    if (e.leaving || !e.name) continue;
    const close = Math.abs(e.px - player.px) + Math.abs(e.py - player.py) <= 2 * T;
    const top = e.type === "creature" || e.type === "cat" ? e.py - 1 : e.py - 4 - (iconOf(e) ? 15 : 1);
    if (e.say && e.say.until > ts && e.type === "agent") { drawSpeech(e.say.text, sx(e.px + 8), sy(top)); continue; }
    if (e === hover || e === talkingTo || close) tag(e.name, sx(e.px + 8), sy(top), e.color || null);
  }
}

/* ---------- The card, the mini map ---------- */

let cardFor = null, cardAt = 0;
function updateCard(ts) {
  if (ts < cardAt) return;
  cardAt = ts + 200;
  let e = null;
  if (!busy) {
    if (hover && hover.type === "agent") e = hover;
    else { const [dx, dy] = DIRS[player.dir]; const front = occupied.get(tk(player.x + dx, player.y + dy)); e = front && front.type === "agent" ? front : null; }
  }
  const a = e && agentById(e.id), card = $("card");
  card.hidden = !a;
  if (!a) { cardFor = null; return; }
  if (cardFor !== a.id) card.innerHTML = `<div class="top"><span class="nm"></span><span class="lv"></span></div><div class="kd"><i></i><span class="kn"></span></div>
    <div class="st"></div><div class="ac"></div><div class="mt"></div><div class="go">Space: talk to them</div>`;
  cardFor = a.id;
  const w = word(a.state), thread = threadOf(a), items = thread ? thread.turns.reduce((n, t) => n + t.items.length, 0) : 0, last = lastItem(a), l = letterOf(a);
  card.querySelector(".nm").textContent = isAssistant(a) ? "Your assistant" : a.name ?? "unknown";
  card.querySelector(".lv").textContent = `N.${Math.max(1, items)}`;
  card.querySelector(".kd i").style.background = kindColor(a.kind);
  card.querySelector(".kn").textContent = `${label(a.kind).toUpperCase()}${a.origin === "elsewhere" ? " · ELSEWHERE" : ""}`;
  const st = card.querySelector(".st"); st.textContent = `${MARK[w][0]} ${SAYS[w]} · ${e.place ? PLACES[e.place].at : ""}`; st.style.color = MARK[w][1];
  card.querySelector(".ac").textContent = w === "working" && last ? line(doing(last), 110) : l && unread(l) ? "✉ A letter is waiting for you." : "";
  card.querySelector(".mt").textContent = [[a.model, a.mode, a.effort].filter(Boolean).join(" · "), tilde(a.folder), `active ${ago(a.updated)}`,
    a.queue.length ? `${a.queue.length} on hold` : ""].filter(Boolean).join(" · ");
}
const MINI = 3, mini = $("mini"), mctx = mini.getContext("2d");
mini.width = W * MINI; mini.height = H * MINI; mini.style.width = W * MINI + "px"; mini.style.height = H * MINI + "px";
const MINI_COLORS = { [GRASS]: "#8fd06e", [TALL]: "#58ad4a", [PATH]: "#ead9a6", [WATER]: "#5aa6e6", [TREE]: "#2e7a3c", [FLOWER]: "#a8dc84", [SIGN]: "#a8743e", [PAVE]: "#ddd6c6", [PIER]: "#c4925a", [PROP]: "#b0a890" };
let miniAt = 0;
function drawMini(ts) {
  if (ts < miniAt) return;
  miniAt = ts + 250;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { mctx.fillStyle = MINI_COLORS[tileAt(x, y)] || "#8a8a96"; mctx.fillRect(x * MINI, y * MINI, MINI, MINI); }
  BUILDINGS.forEach((b) => { mctx.fillStyle = b.tower ? "#7a5cd0" : b.style.roof; mctx.fillRect(b.x * MINI, b.y * MINI, b.w * MINI, b.h * MINI); });
  PLOTS.forEach((p) => { mctx.fillStyle = p.folder ? p.style.roof : "#c9a878"; mctx.fillRect(p.x * MINI, p.y * MINI, p.w * MINI, p.h * MINI); });
  const blink = Math.floor(ts / 400) % 2;
  for (const e of agentsE.values()) {
    if (e.leaving) continue;
    mctx.fillStyle = e.word === "waiting" ? (blink ? "#e2463c" : "#ffffff") : MARK[e.word][1];
    mctx.fillRect(Math.round(e.px / T * MINI) - 1, Math.round(e.py / T * MINI) - 1, 4, 4);
  }
  mctx.fillStyle = "#262836"; mctx.fillRect(Math.round(player.px / T * MINI) - 2, Math.round(player.py / T * MINI) - 2, 6, 6);
  mctx.fillStyle = blink ? "#ffffff" : "#e2463c"; mctx.fillRect(Math.round(player.px / T * MINI) - 1, Math.round(player.py / T * MINI) - 1, 4, 4);

    Math.min(W * MINI, cw / scale / T * MINI) - 1, Math.min(H * MINI, (ch - SAFE - TOP) / scale / T * MINI) - 1);

function frame(ts) {
  const dt = Math.min(0.05, (ts - (frame.last || ts)) / 1000); frame.last = ts;
  rebuildOccupied();
  stepPlayer(dt, ts);
  for (const [id, e] of agentsE) { if (e.leaving && ts - e.leaving > 700) agentsE.delete(id); else stepAgent(e, dt, ts); }
  stepCreatures(dt, ts); stepCat(dt, ts); stepFixed(ts); stepMotes(dt, ts);
  typeTick(dt); draw(ts); updateCard(ts); drawMini(ts);
  requestAnimationFrame(frame);
}

/* ---------- Keys and mouse ---------- */

const KEYS = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
const KONAMI = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
const typedKeys = [];
function secretCode(e) {
  typedKeys.push(e.key.length === 1 ? e.key.toLowerCase() : e.key);
  if (typedKeys.length > KONAMI.length) typedKeys.shift();
  if (typedKeys.join() !== KONAMI.join()) return;
  typedKeys.length = 0;
  memory.doc.gb = !memory.doc.gb; memory.touch("gb");
  document.body.classList.toggle("gb", memory.doc.gb);
  toast(memory.doc.gb ? "Four-green mode! (same code to go back)" : "Back to colors."); SFX.fanfare(); earn("retro");
}
addEventListener("keydown", (e) => {
  wake();
  if (e.metaKey || e.ctrlKey || e.altKey) return;              // ⌘K, ⌘J… belong to something
  player.run = e.shiftKey;
  if (e.target === $("input")) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (UI.submit) UI.submit(UI.fallback); }
    else if (e.key === "Escape") { e.preventDefault(); pickNow(null); }
    return;
  }
  secretCode(e);
  const dir = KEYS[e.code], A = ["Space", "Enter", "NumpadEnter"].includes(e.code), B = e.code === "Escape" || e.code === "Backspace", Mk = e.key === "m" || e.key === "M";
  if (dir || A || B || Mk) e.preventDefault();
  if (A && e.repeat) return;
  if (UI.mode === "say") { if (A || B) advance(); return; }
  if (UI.mode === "choose") {
    if (dir === "up" || dir === "down") { mark(UI.index + (dir === "up" ? -1 : 1)); SFX.blip(); }
    else if (A) pickNow(UI.options[UI.index].key); else if (B) pickNow(null);
    return;
  }
  if (UI.mode === "panel") {
    if (dir === "up" || dir === "down") { if (UI.rows.length) markRow(UI.index + (dir === "up" ? -1 : 1)); else (!$("pbody").hidden ? $("pbody") : $("plist")).scrollBy(0, dir === "up" ? -70 : 70); }
    else if ((dir === "left" || dir === "right") && UI.acts.length) markAct(UI.act + (dir === "left" ? -1 : 1));
    else if (A) pickNow(UI.rows.length ? UI.rows[UI.index].key : UI.acts.length ? UI.acts[UI.act].key : null); else if (B) pickNow(null);
    return;
  }

    if (!held.includes(dir)) held.push(dir);
    player.path = []; player.goal = null;
    if (!player.move && player.dir !== dir) { player.dir = dir; player.turnAt = performance.now() + 90; }
  } else if (A) { const [dx, dy] = DIRS[player.dir]; interact(thingAt(player.x + dx, player.y + dy)); }
  else if (B || Mk) converse(startMenu);
});
addEventListener("keyup", (e) => { player.run = e.shiftKey; const dir = KEYS[e.code]; if (dir && held.includes(dir)) held.splice(held.indexOf(dir), 1); });
addEventListener("blur", () => { held.length = 0; player.run = false; });
function tileUnder(e) {
  const cam = camera(), wx = e.clientX / scale + cam.x, wy = e.clientY / scale + cam.y;

cv.addEventListener("pointerdown", (e) => {
  wake();
  if (UI.mode === "say") return advance();
  if (busy || UI.mode) return;
  goTo(...tileUnder(e));
});
cv.addEventListener("pointermove", (e) => {
  const [x, y] = tileUnder(e), thing = thingAt(x, y);

});
mini.addEventListener("pointerdown", (e) => { wake(); if (!busy && !UI.mode) goTo(Math.floor(e.offsetX / MINI), Math.floor(e.offsetY / MINI)); });

$("menuBtn").addEventListener("click", () => { wake(); converse(startMenu); });
$("mailBtn").addEventListener("click", () => { wake(); converse(courrier); });
$("pclose").addEventListener("click", () => pickNow(null));

/* ---------- Start ---------- */

function problem(error) { $("problem").hidden = !error; $("problem").textContent = error ? error.message : ""; }
// What the memory says about the world itself: the person's place, the secrets already found, the look.
function remember() {
  const d = memory.doc;
  document.body.classList.toggle("gb", !!d.gb);
  if (d.found.candy && PROPS.has(tk(CANDY.x, CANDY.y))) { PROPS.delete(tk(CANDY.x, CANDY.y)); lay(CANDY.x, CANDY.y, 1, 1, FLOWER); }
  if (d.found.simularbre) lay(SIMULARBRE[0], SIMULARBRE[1], 1, 1, GRASS);
  maps.clear();
  if (d.player && walkable(d.player.x, d.player.y) && !fixedAt(d.player.x, d.player.y)) { placeAt(player, d.player.x, d.player.y); player.dir = d.player.dir || "down"; }
}
addEventListener("resize", resize);
resize();
requestAnimationFrame(frame);
if (!S) problem({ message: "Open this village in something: only something can bring your agents here." });
else (async () => {
  await memory.load();
  remember();
  S.on("change", (next) => sync(next));
  S.on("granted", () => memory.load().then(() => S.state()).then(sync, problem));   // a right given or revoked
  await S.state().then((next) => { sync(next); problem(null); draw(performance.now()); }, problem);
