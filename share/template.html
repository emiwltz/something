<!doctype html>
<!-- A space for something, contract 1: the page `something new` starts from. Read the guide first
     (`something guide --print`), then make this page the one the person asked for: keep what it needs, drop the rest. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My space</title>
<!-- The declaration. Ask only for the rights the page uses: the person allows or refuses each one in a window of the
     Mac. Here: see every agent ("state" with "see": "all"), write to them ("send"), start one ("launch"; the person
     picks the folder it works in, unless you add "folder": "~/code/example"). -->
<script type="application/json" id="something">
{
  "contract": 1,
  "title": "My space",
  "description": "The agents on this Mac, and a line to write to one.",
  "agents": { "see": "all" },
  "rights": ["state", "send", "launch"]
}
</script>
<style>
  [hidden] { display: none !important; }
  /* something's own colours (ink on linen, a calm night) and a dot per state: change them freely, they are a start. */
  :root {
    color-scheme: light dark; font: 15px/1.5 -apple-system, system-ui, sans-serif;
    --bg: #f4f4f1; --card: #fff; --ink: #121316; --soft: #5c5e66; --line: rgba(18, 19, 22, .1);
    --work: #2a7d57; --wait: #e0a21a; --bad: #c23a35;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171c; --card: #1f2126; --ink: #f1f1ee; --soft: #a5a6aa; --line: rgba(241, 241, 238, .11);
            --work: #7bc79b; --wait: #f2c14e; --bad: #f07a6e; }
  }
  body { margin: 0 auto; padding: 40px 24px; max-width: 640px; background: var(--bg); color: var(--ink); }
  h1 { font: 600 30px/1.2 ui-serif, "New York", Georgia, serif; margin: 0 0 18px; }
  ul { list-style: none; padding: 4px; margin: 0 0 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  li + li { border-top: 1px solid var(--line); }
  label { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  label:has(input:checked) { background: var(--line); }
  input[type=radio] { position: absolute; opacity: 0; }
  label:has(input:focus-visible) { outline: 2px solid var(--ink); }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--soft); }
  .working .dot { background: var(--work); } .waiting .dot { background: var(--wait); } .error .dot { background: var(--bad); }
  .idle .dot, .unknown .dot { background: none; box-shadow: inset 0 0 0 1.5px var(--soft); }
  .state { margin-left: auto; color: var(--soft); font-size: 13px; }
  .quiet { color: var(--soft); font-size: 13px; padding: 8px 10px; }
  .alert { border-left: 3px solid var(--bad); padding: 6px 10px; margin: 4px 10px 8px; color: var(--bad); }
  form { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
  textarea { flex: 1; font: inherit; padding: 8px 10px; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  button { font: 500 13px/1 -apple-system, system-ui, sans-serif; padding: 8px 14px; border-radius: 8px; cursor: pointer;
           color: var(--bg); background: var(--ink); border: 0; }
  #launch button { margin: 0 6px 6px 0; color: var(--ink); background: var(--card); border: 1px solid var(--line); }
</style>
</head>
<body>
<h1>My space</h1>
<p id="problem" class="alert" role="alert" hidden></p>
<ul id="agents"></ul>
<div id="launch"></div>
<form id="write" hidden>
  <textarea id="text" rows="2" placeholder="Write to the agent you chose"></textarea>
  <button type="submit">Send</button>
</form>
<p id="note" class="quiet"></p>
<script>
  // something.js is already there: something injects it before this script. Each call returns a promise; a
  // rejection carries .code and .message, one sentence for the person. Show it, never swallow it.
  const $ = (id) => document.getElementById(id);
  // Show the harness's name, never the program's. A kind this page does not know is "other agent".
  const NAMES = { claude: "Claude Code", codex: "Codex", opencode: "OpenCode", pi: "pi", omp: "OMP" };
  const label = (kind) => NAMES[kind] || "other agent";
  // What is not known is null: say "unknown", never guess.
  const known = (value) => value === null ? "unknown" : value;
  // A right counts when it was granted plainly ("send") or for this kind ("send:claude"). The person can refuse or
  // revoke one at any time: read something.granted, never the declaration.
  const has = (right, kind) => something.granted.rights.some((r) => r === right || r === right + ":" + kind);
  const element = (tag, properties) => Object.assign(document.createElement(tag), properties);
  let chosen = null;

  function problem(error) {
    $("problem").hidden = !error;
    $("problem").textContent = error ? error.message : "";
  }

  function render(state) {
    if (!state.agents.some((a) => a.id === chosen)) chosen = null;
    $("agents").replaceChildren(...state.agents.map(function (agent) {
      const item = element("li");
      const pick = element("input", { type: "radio", name: "agent", checked: agent.id === chosen });
      pick.onchange = () => { chosen = agent.id; render(state); };
      // A request waits in a window of the Mac: a page sees it and never answers it. Say where to answer.
      const waits = state.requests.some((r) => r.agent === agent.id);
      const line = element("label", { className: waits ? "waiting" : agent.state });
      line.append(pick, element("span", { className: "dot" }), `${known(agent.name)} · ${label(agent.kind)}`,
        element("span", { className: "state", textContent: waits ? "waits for you, answer in something's window" : agent.state }));
      item.append(line);
      if (agent.error) item.append(element("div", { className: "alert", textContent: agent.error.message }));
      return item;
    }));
    if (!state.agents.length) $("agents").append(element("li", { className: "quiet", textContent: "No agent yet. Start one in a terminal, and it appears here." }));

    // Offer a launch only for a kind something can launch, found on this Mac, and granted to this page.
    const kinds = Object.keys(state.kinds).filter((k) => state.kinds[k].launch && state.kinds[k].installed !== false && has("launch", k));
    $("launch").replaceChildren(...kinds.map(function (kind) {
      const button = element("button", { type: "button", textContent: "Launch " + label(kind) });
      button.onclick = () => something.launch(kind).then((id) => { chosen = id; problem(null); }).catch(problem);
      return button;
    }));

    // `can` says what a call would do now and `because` why not: hide what cannot be done, and say why.
    const agent = state.agents.find((a) => a.id === chosen);
    $("write").hidden = !(agent && agent.can.send && has("send", agent.kind));
    const notes = Object.keys(state.kinds).map((k) => state.kinds[k].note).filter(Boolean);
    $("note").textContent = !agent ? notes.join(" ")
      : !agent.can.send ? agent.because.send || "This agent cannot take a message now."
      : !has("send", agent.kind) ? `This space may not write to ${label(agent.kind)}. Allow it in Info (⌘I).` : "";
  }

  something.on("change", render);
  something.on("granted", () => something.state().then(render, problem));
  something.state().then(render, problem);

  $("write").onsubmit = function (event) {
    event.preventDefault();
    // "next" (the default) waits for the running turn to end (on a waiting agent: until the person answered in
    // something's window); "now" steers into it, where can.steer is true. The form is outside what render redraws,
    // so a change that arrives while the person types keeps their text.
    something.send(chosen, $("text").value, { when: "next" })
      .then(({ delivery }) => { $("text").value = ""; problem(null); $("note").textContent = "Message " + delivery + "."; })
      .catch(problem);
  };
</script>
</body>
</html>
