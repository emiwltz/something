<!doctype html>
<!-- The first page: nearly blank on purpose. Choose an agent, read what was said, write to it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>something</title>
<style>
  :root { color-scheme: light dark; font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  body { margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 12px; height: 100vh; box-sizing: border-box; }
  header { display: flex; gap: 8px; align-items: center; }
  #about { opacity: .65; font-size: 13px; }
  #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .from { font-weight: 600; }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; font: inherit; padding: 6px 8px; resize: vertical; }
  form { align-items: flex-end; }
  #status { opacity: .65; font-size: 13px; min-height: 1.5em; }
  #problem { border-left: 3px solid #c0392b; padding: 6px 10px; background: rgba(192, 57, 43, .1); }
  #waiting { border-left: 3px solid #d68910; padding: 6px 10px; background: rgba(214, 137, 16, .12); }
</style>
<script type="application/json" id="something">
{ "contract": 1, "title": "something", "agents": { "see": "all" }, "rights": ["state", "send", "launch"] }
</script>
</head>
<body>
<header>
  <select id="agents" aria-label="Agent"></select>
  <span id="launches"></span>
</header>
<div id="about"></div>
<div id="problem" role="alert" hidden></div>
<div id="waiting" role="status" hidden></div>
<div id="messages"></div>
<form id="write">
  <textarea id="text" rows="3" placeholder="Write to the agent (Enter sends, Shift+Enter for a new line)"></textarea>
  <button type="submit">Send</button>
</form>
<div id="status"></div>
<script>
  // Contract 1 (share/guide.md): something.js is already there, injected by something before this script.
  const $ = (id) => document.getElementById(id);
  const unknown = (value) => value === null ? "unknown" : value;
  let current = null;

  function show(state) {
    const kinds = Object.keys(state.kinds).filter((kind) => state.kinds[kind].launch);
    $("launches").replaceChildren(...kinds.map(function (kind) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "Launch " + kind + "…";
      button.onclick = function () {
        something.launch(kind).then(function (id) { current = id; said(); return something.state(); }).then(show).catch(said);
      };
      return button;
    }));
    if (!state.agents.some((a) => a.id === current)) current = state.agents.length ? state.agents[0].id : null;
    const select = $("agents");
    select.replaceChildren(...state.agents.map(function (agent) {
      const option = new Option(unknown(agent.name) + " (" + agent.kind + ")", agent.id);
      option.selected = agent.id === current;
      return option;
    }));
    select.hidden = !state.agents.length;
    const agent = state.agents.find((a) => a.id === current);
    $("write").hidden = !(agent && agent.can.send);
    $("problem").hidden = !(agent && agent.error);
    $("problem").textContent = agent && agent.error ? agent.kind + " says: " + agent.error.message : "";
    const request = agent && state.requests.find((r) => r.agent === agent.id);
    $("waiting").hidden = !request;
    $("waiting").textContent = request ? "Waiting for you" + (request.tool ? ": may it use " + request.tool +
      (request.about ? " (" + request.about + ")" : "") + "?" : ".") + " Answer in the window something opened." : "";
    if (!agent) {
      const notes = Object.keys(state.kinds).map((k) => state.kinds[k].note).filter(Boolean);
      $("about").textContent = kinds.length ? "No agent yet. Launch one." : "No agent yet. " + (notes[0] || "something cannot launch agents yet.");
      $("messages").replaceChildren();
      return;
    }
    $("about").textContent = [unknown(agent.folder), "model " + unknown(agent.model), "mode " + unknown(agent.mode),
      agent.state].join(" · ");
    const thread = state.threads.find((t) => t.id === agent.thread);
    const items = thread ? thread.turns.flatMap((turn) => turn.items).filter((item) => item.kind === "message") : [];
    $("messages").replaceChildren(...items.map(function (item) {
      const line = document.createElement("div");
      const from = document.createElement("span");
      from.className = "from";
      from.textContent = (item.author === "person" ? "you" : unknown(agent.name)) + ": ";
      line.append(from, item.text);
      return line;
    }));
    $("messages").scrollTop = $("messages").scrollHeight;
  }

  function said(error) { $("status").textContent = error ? error.message : ""; }

  something.on("change", show);
  something.state().then(show).catch(said);
  $("agents").onchange = function () { current = this.value; something.state().then(show); };
  // Enter sends, Shift+Enter starts a new line: a long prompt can be pasted with its lines.
  $("text").onkeydown = function (event) {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      $("write").requestSubmit();
    }
  };
  $("write").onsubmit = function (event) {
    event.preventDefault();
    something.send(current, $("text").value).then(function () { $("text").value = ""; said(); }).catch(said);
  };
</script>
</body>
</html>
