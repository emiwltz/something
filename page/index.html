<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>something</title>
  <link rel="icon" href="data:,">   <!-- no icon: without this line, the browser asks the server for one -->
  <!-- something's blank page: choose an agent, read what was said, write to it. Nothing else.
       Copy this file into page/ under another name and build yours from it. What else something knows of an agent
       (its state, its model, its todos, the events) is shown at work in everything.html. -->
  <style>
    /* Enough to read, nothing more. Light and dark follow the system setting. */
    :root { color-scheme: light dark; --muted: #595959; --rule: #c8c8c8; --alert: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --muted: #a8a8a8; --rule: #4a4a4a; --alert: #ffb4ab; } }
    body {
      font: 100%/1.5 system-ui, sans-serif; max-width: 40rem; margin: 0 auto; padding: 1rem;
      overflow-wrap: anywhere;          /* a long path or identifier does not make the page overflow */
    }
    small, label, dt { color: var(--muted); font-size: .8125rem; }
    button, select, textarea { font: inherit; }
    button, select { padding: .35rem .8rem; }
    #choice {                           /* the selector stays in view, however long the messages are */
      position: sticky; top: 0; margin: 0; padding: .75rem 0; background: Canvas;
      display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .75rem;
    }
    #messages { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .75rem 1rem; }
    dt { padding-top: .2rem; }
    dd { margin: 0; white-space: pre-wrap; }
    textarea { display: block; box-sizing: border-box; width: 100%; margin: .25rem 0 .5rem; }
    #outage { color: var(--alert); font-weight: 600; }
    .stale { opacity: .5; }             /* what stays on screen when the server no longer answers */
  </style>
</head>
<body>
  <p><small>something<span id="example" hidden> · example data: these agents are not real, and no message is
    sent</span></small></p>
  <p id="outage" role="alert" hidden></p>

  <main id="page">
    <p id="choice">
      <label for="agent">Agent</label>
      <select id="agent"></select>
      <small id="waiting" hidden></small>
    </p>
    <p id="none" hidden></p>

    <button id="older" type="button" hidden>Older messages</button>
    <dl id="messages"></dl>
    <p id="unreadable" role="status"></p>

    <form id="write">
      <label id="to" for="text">Write to it</label>
      <textarea id="text" rows="3" required></textarea>
      <button id="send">Send</button>
      <p id="feedback" role="status"></p>
    </form>
  </main>

  <p><small><a href="/everything.html">Everything something knows of them</a></small></p>

  <script src="/something.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    let agents = [];        // the agents of the last state
    let chosen = null;      // the id of the agent whose messages are shown
    let listed = "";        // what the selector lists, to rebuild it only when that changes
    let activity = null;    // the chosen agent's last known write, to know when to read its messages again
    let wentBack = false;   // true as soon as older messages are shown
    let cursor = null;      // what to pass to `before` to go back further
    let reads = 0;          // only the last read asked for is shown
    let jump = false;       // true when the next messages shown are those of an agent just chosen

    // Makes an element. The text goes in through textContent: what an agent writes stays text, never HTML.
    function el(tag, text) {
      const element = document.createElement(tag);
      element.textContent = text;
      return element;
    }

    // The name each agent goes by: the one given in Herdr, otherwise its harness. Two agents that would read the
    // same also say their title.
    function names() {
      const short = (a) => a.name ?? a.harness ?? a.id;
      const twice = (a) => agents.filter((b) => short(b) === short(a)).length > 1;
      return new Map(agents.map((a) => [a.id, twice(a) ? `${short(a)} · ${a.title ?? a.id}` : short(a)]));
    }

    // ——— Something.watch: the agents, right away, then at each change ———
    Something.watch((state) => {
      const down = state.error?.startsWith("Herdr does not answer")
        ? ". Is a Herdr session running? something keeps asking, and comes back by itself." : "";
      $("outage").textContent = (state.error ?? "") + down;
      $("outage").hidden = !state.error;
      $("page").classList.remove("stale");
      $("example").hidden = !state.example;

      agents = state.agents;
      const name = names();
      // One line per agent, a dot before those that wait for you (Herdr's state "blocked"). The list is rebuilt
      // only when it changes: a browser closes a list that is rebuilt while it is open.
      const lines = agents.map((a) => [a.id, (a.state === "blocked" ? "● " : "") + name.get(a.id)]);
      if (JSON.stringify(lines) !== listed) {
        listed = JSON.stringify(lines);
        $("agent").replaceChildren(...lines.map(([id, text]) => Object.assign(el("option", text), { value: id })));
      }
      const waiting = agents.filter((a) => a.state === "blocked").length;
      $("waiting").textContent = `● ${waiting} ${waiting > 1 ? "wait" : "waits"} for you`;
      $("waiting").hidden = !waiting;
      // Without Herdr, an empty list does not mean "no agent": we do not know.
      $("none").textContent = state.herdr.connected ? "No agent in Herdr: start one in a pane, it shows up here."
        : "Unknown: Herdr is not connected.";
      $("none").hidden = agents.length > 0;
      $("write").hidden = $("agent").disabled = !agents.length;

      const still = agents.find((a) => a.id === chosen);
      if (!still) choose(agents[0]?.id ?? null);        // at the start, and when the chosen agent is gone
      $("agent").value = chosen ?? "";
      $("to").textContent = `Write to ${name.get(chosen) ?? "it"}`;      // its name can change, like its title
      // Its messages are read again when the chosen agent has written, as long as you have not gone back in time.
      if (still && !wentBack && still.activity !== activity) {
        activity = still.activity;
        read();
      }
    }, (sentence) => {
      // The server no longer answers: the page says so, and shows that what stays on screen is old.
      $("outage").textContent = `${sentence}. What is shown dates from the last state received.`;
      $("outage").hidden = false;
      $("page").classList.add("stale");
    });

    // ——— Something.conversation: the chosen agent's last messages, then older ones with `before` ———
    async function read(before) {
      const mine = ++reads, id = chosen;
      try {
        const response = await Something.conversation(id, { turns: 10, before });
        if (mine !== reads) return;     // a more recent read was asked for in the meantime
        const who = names().get(id) ?? id;
        const rows = response.turns.flatMap((turn) => [
          el("dt", turn.from === "user" ? "you" : turn.from), el("dd", turn.text),
          ...turn.replies.flatMap((reply) => [el("dt", who), el("dd", reply.text)]),
        ]);
        if (before) $("messages").prepend(...rows);
        else $("messages").replaceChildren(...rows);
        cursor = response.before;
        $("older").hidden = !(response.older && cursor);
        $("unreadable").textContent = rows.length || before ? "" : "No message yet.";
        if (jump) $("write").scrollIntoView();          // an agent just chosen: its last messages and the field
        jump = false;
      } catch (error) {
        if (mine === reads) $("unreadable").textContent = error.message;     // the server's sentence, as is
      }
    }

    function choose(id) {
      if (id !== chosen) $("text").value = "";          // what was typed for another agent does not follow
      chosen = id;
      activity = agents.find((a) => a.id === id)?.activity ?? null;
      wentBack = false;
      jump = true;
      $("to").textContent = `Write to ${names().get(id) ?? "it"}`;
      $("messages").replaceChildren();
      $("older").hidden = true;
      $("unreadable").textContent = $("feedback").textContent = "";
      if (id) read();
    }

    $("agent").addEventListener("change", () => choose($("agent").value));
    $("older").onclick = () => { wentBack = true; read(cursor); };

    // ——— Something.send: send a message; if it is not sent, the server's sentence is shown as is ———
    $("write").addEventListener("submit", async (submission) => {
      submission.preventDefault();
      const id = chosen, who = names().get(id) ?? id;
      $("send").disabled = true;        // no double send while the message is leaving
      $("feedback").textContent = "Sending…";
      try {
        await Something.send(id, $("text").value);
        if (id === chosen) $("text").value = "";
        $("feedback").textContent = `Sent to ${who}.`;
      } catch (error) {
        // Without an answer, the message may have left all the same, unless the failure came before anything was
        // written to Herdr (README, `Something.send`). Said even if another agent was chosen meanwhile.
        const doubt = /^(Herdr|something) does not answer|^something answered badly/.test(error.message)
          && !/^Herdr does not answer: (socket missing|connection refused) \(/.test(error.message);
        $("feedback").textContent = (id === chosen ? "" : `To ${who}: `) + error.message
          + (doubt ? ". The message may have left all the same: look at the pane before sending it again." : "");
      }
      $("send").disabled = false;
    });
  </script>
</body>
</html>
