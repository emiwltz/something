<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-label="Four levels, each adding to the one before: not see, watch, talk to, start.">
<style>
.t{font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2328}.s{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#59636e}
.a{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}.b{fill:#e6f4f0;stroke:#0f6e5c;stroke-width:1.5}.c{fill:#c9e8df;stroke:#0f6e5c;stroke-width:1.5}.d{fill:#a5d9cb;stroke:#0f6e5c;stroke-width:1.5}
@media (prefers-color-scheme:dark){.t{fill:#f0f6fc}.s{fill:#b4bcc5}.a{fill:#151b23;stroke:#3d444d}.b{fill:#10302a;stroke:#58c9b0}.c{fill:#14443b;stroke:#58c9b0}.d{fill:#19594d;stroke:#58c9b0}}
</style>
<rect class="a" x="10" y="170" width="220" height="70" rx="8"/><text class="t" x="28" y="200">not see</text><text class="s" x="28" y="222">no agent at all</text>
<rect class="b" x="246" y="120" width="220" height="120" rx="8"/><text class="t" x="264" y="150">watch</text><text class="s" x="264" y="174">state, folder,</text><text class="s" x="264" y="194">last messages</text>
<rect class="c" x="482" y="70" width="220" height="170" rx="8"/><text class="t" x="500" y="100">talk to</text><text class="s" x="500" y="124">also writes to them:</text><text class="s" x="500" y="144">a message, stop one,</text><text class="s" x="500" y="164">change its model</text>
<rect class="d" x="718" y="20" width="232" height="220" rx="8"/><text class="t" x="736" y="50">start</text><text class="s" x="736" y="74">also starts an agent</text><text class="s" x="736" y="94">in a folder you pick</text>
</svg>
