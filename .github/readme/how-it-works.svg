<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="You describe a page, your agent builds it, something shows it locked off the network and bridges it to the agents on your Mac; only you answer permissions.">
<style>
.t{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2328}.s{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#59636e}.m{font:12px ui-monospace,Menlo,monospace;fill:#59636e}
.b{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}.k{fill:#fff;stroke:#0f6e5c;stroke-width:2;stroke-dasharray:6 4}.l{stroke:#59636e;stroke-width:1.6;fill:none}.h{fill:#59636e}.w{fill:#fff4e5;stroke:#b86e00;stroke-width:1.5}
@media (prefers-color-scheme:dark){.t{fill:#f0f6fc}.s,.m{fill:#9198a1}.b{fill:#151b23;stroke:#3d444d}.k{fill:#0d1117;stroke:#58c9b0}.l{stroke:#9198a1}.h{fill:#9198a1}.w{fill:#2b2111;stroke:#e0b25a}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="b" x="10" y="50" width="150" height="110" rx="10"/><text class="t" x="85" y="98" text-anchor="middle">You</text><text class="s" x="85" y="122" text-anchor="middle">describe a page</text>
<path class="l" d="M160 105H208" marker-end="url(#a)"/>
<rect class="b" x="212" y="50" width="170" height="110" rx="10"/><text class="t" x="297" y="98" text-anchor="middle">Your assistant</text><text class="s" x="297" y="122" text-anchor="middle">your agent builds it</text>
<path class="l" d="M382 105H430" marker-end="url(#a)"/>
<rect class="k" x="434" y="30" width="200" height="150" rx="10"/><text class="t" x="534" y="92" text-anchor="middle">Your space</text><text class="s" x="534" y="116" text-anchor="middle">an HTML page</text><text class="s" x="534" y="136" text-anchor="middle">locked off the network</text>
<path class="l" d="M634 105H726" marker-start="url(#a)" marker-end="url(#a)"/><text class="m" x="680" y="92" text-anchor="middle">something.js</text>
<rect class="b" x="730" y="50" width="220" height="110" rx="10"/><text class="t" x="840" y="92" text-anchor="middle">Agents on your Mac</text><text class="s" x="840" y="116" text-anchor="middle">Claude Code, Codex, pi</text><text class="s" x="840" y="134" text-anchor="middle">and more</text>
<path class="l" d="M840 160V238H700" marker-end="url(#a)"/>
<rect class="w" x="370" y="208" width="326" height="74" rx="10"/><text class="t" x="533" y="238" text-anchor="middle">A window of your Mac</text><text class="s" x="533" y="262" text-anchor="middle">Allow Once or Deny. A space can never answer.</text>
<path class="l" d="M85 160V245H366" marker-end="url(#a)"/><text class="s" x="225" y="235" text-anchor="middle">only you decide</text>
</svg>
