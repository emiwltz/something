# The tests on GitHub's Macs, at each push, on macOS 15, the floor the package, the app and the formula
# declare, and on macos-latest.
#
# Job "tests": something builds, the whole Swift suite passes, something.js answers the contract's cases,
# make-app.sh assembles a signed something.app from a release build, whose something check of the template is clean,
# and something and its tests build again with the runner's Command Line Tools alone, as on a Mac without Xcode. The
# runner has a logged-in window server, so the window tests run too (the lockdown test, isolation, the bridge, links,
# rights, reload) in a real WKWebView that is never shown. On a Mac with no window server those suites say so and are
# skipped; on CI (CI is set) they always run, so a runner without one turns the run red instead of skipping the
# lockdown test.
#
# Job "brew": a person's install on that fresh Mac. The formula of packaging/homebrew/ goes into a local tap, pointed
# at this commit instead of GitHub, then brew install --HEAD, brew test and the command as a person types it. It logs
# how long brew install alone took, and fails above five minutes: a newcomer's brew install and first start must take
# less than that together, and the first start cannot be timed on a runner. The installed program must carry the
# runner's SDK stamp, the one that gives it the current look of macOS.
#
# No secret is used; the token can only read the repository.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: sw_vers && swift --version && node --version
      - run: swift build
      - name: swift test
        # A hung test must not hold the runner: GitHub stops the whole process tree after 20 minutes and says so.
        timeout-minutes: 20
        run: swift test
      - run: node --test Tests/something-js.test.mjs
      - name: make-app.sh into a temporary prefix
        run: |
          prefix="$RUNNER_TEMP/prefix"
          tools/make-app.sh "$prefix" 0.0.0-ci
          codesign --verify --deep --strict "$prefix/something.app"
          # The wrapper Homebrew's write_exec_script writes: a symlink would break Bundle.main.
          mkdir -p "$prefix/bin"
          printf '#!/bin/bash\nexec "%s" "$@"\n' "$prefix/something.app/Contents/MacOS/something" > "$prefix/bin/something"
          chmod +x "$prefix/bin/something"
          test "$("$prefix/bin/something" --version)" = "something 0.0.0-ci"
      - name: something check, the whole command, through the assembled program
        # The suite runs every check in its own process; this is main.swift and Check.main as a person runs them,
        # in an empty home. The runner is thrown away, so the folders WebKit leaves in $TMPDIR do not matter here.
        run: |
          prefix="$RUNNER_TEMP/prefix"
          mkdir "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" "$prefix/bin/something" check "$prefix/something.app/Contents/Resources/share/template.html" --json \
            > "$RUNNER_TEMP/check.json" 2> "$RUNNER_TEMP/check.err"
          test ! -s "$RUNNER_TEMP/check.err"
          python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); assert r["problems"] == [] and open(r["snapshot"], "rb").read(4) == b"\x89PNG", r' "$RUNNER_TEMP/check.json"
      - name: swift build --build-tests with the Command Line Tools alone
        # In a build folder of its own: the suite's was made with Xcode's toolchain. --build-tests compiles the test
        # targets and Swift Testing's macros, which Package.swift points at with the Command Line Tools.
        run: |
          if [ -d /Library/Developer/CommandLineTools ]; then
            DEVELOPER_DIR=/Library/Developer/CommandLineTools swift --version
            DEVELOPER_DIR=/Library/Developer/CommandLineTools swift build --build-tests --scratch-path "$RUNNER_TEMP/clt-build"
          else
            echo "::notice title=Command Line Tools on ${{ matrix.os }}::This runner has none: the build with them alone was not tried."
          fi

  brew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # brew update would time Homebrew's own download, not something's install.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so that it can be pushed into the local repository the formula builds from.
          fetch-depth: 0
      - name: A local tap whose formula builds this commit
        run: |
          git init -q --bare "$RUNNER_TEMP/something.git"
          git push -q "$RUNNER_TEMP/something.git" HEAD:refs/heads/main
          brew tap-new --no-git local/something
          tap="$(brew --repository)/Library/Taps/local/homebrew-something"
          echo "TAP=$tap" >> "$GITHUB_ENV"
          # Only the head line changes: GitHub's address becomes this commit, in a repository on this runner.
          sed "s|^  head .*|  head \"file://$RUNNER_TEMP/something.git\", branch: \"main\", using: :git|" \
            packaging/homebrew/something.rb > "$tap/Formula/something.rb"
          grep -q "file://$RUNNER_TEMP/something.git" "$tap/Formula/something.rb"
      - name: brew install, timed
        run: |
          start=$(date +%s)
          brew install --HEAD local/something/something
          seconds=$(( $(date +%s) - start ))
          # What is timed: brew install alone, without brew update (turned off above) and without the first start.
          # Both must take under five minutes, so the install alone above 300 s turns the run red.
          if [ "$seconds" -gt 300 ]; then
            echo "::error title=brew install on ${{ matrix.os }}::${seconds} s for brew install alone (no update, no first start): over the 300 s limit"
            exit 1
          fi
          echo "::notice title=brew install on ${{ matrix.os }}::${seconds} s for brew install alone (no update, no first start); the limit is 300 s"
      - run: brew test local/something/something
      - name: The command, as a person types it
        run: |
          something --version
          something guide
          something check "$(brew --prefix)/opt/something/something.app/Contents/Resources/share/template.html"
      - name: The installed program is stamped with the runner's SDK
        # make-app.sh stamps the SDK that compiled the program; inside Homebrew's build that must still be the
        # runner's, or a bottle made the same way would look old.
        run: |
          program="$(brew --prefix)/opt/something/something.app/Contents/MacOS/something"
          stamped=$(xcrun vtool -show-build "$program" | awk '$1 == "sdk" {print $2; exit}')
          sdk=$(xcrun --show-sdk-version)
          echo "::notice title=SDK stamp on ${{ matrix.os }}::the installed program is stamped with SDK $stamped; the runner's SDK is $sdk"
          # vtool prints "n/a" for an empty stamp: anything but a number fails, before any comparison.
          major=${stamped%%.*}
          case "$major" in
            '' | *[!0-9]*) echo "::error title=SDK stamp on ${{ matrix.os }}::stamped with SDK ${stamped:-nothing}, not a version"; exit 1 ;;
          esac
          if [ "$major" -lt "${sdk%%.*}" ]; then
            echo "::error title=SDK stamp on ${{ matrix.os }}::stamped with SDK $stamped, below the runner's $sdk"
            exit 1
          fi
      - name: brew style and brew audit, on the formula as it goes into the tap
        run: |
          cp packaging/homebrew/something.rb "$TAP/Formula/something.rb"
          brew style local/something/something
          brew audit --formula local/something/something
