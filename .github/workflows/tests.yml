# The tests on a Mac that is not the author's, at each push: something builds and its suite passes.
# The window itself needs a screen, so it is checked by hand (`swift run something --self-test`).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - run: node --test Tests/something-js.test.mjs
